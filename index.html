<script>
'use strict';

const BASE = 'https://data-api.binance.vision';
const STATE = { symbol: 'BTCUSDT', depthHistory: [] };

function log(msg, cls) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if (cls) d.style.color = cls === 'ok' ? 'var(--green)' : cls === 'err' ? 'var(--red)' : 'var(--amber)';
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 40) el.removeChild(el.firstChild);
}

function fmt(n, dec) {
  if (!isFinite(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return n.toLocaleString(undefined, {maximumFractionDigits: dec || 1});
  if (a >= 1) return n.toFixed(dec || 3);
  if (a >= 0.01) return n.toFixed(4);
  return n.toPrecision(4);
}

/* ============================================================
   FETCHERS
   ============================================================ */
async function fetchKlines(symbol, interval, limit) {
  const r = await fetch(`${BASE}/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
  if (!r.ok) throw new Error('klines ' + r.status);
  const raw = await r.json();
  return raw.map(k => ({ t: +k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5], tb: +k[9] }));
}

async function fetchDepth(symbol, limit) {
  const r = await fetch(`${BASE}/api/v3/depth?symbol=${symbol}&limit=${limit}`);
  if (!r.ok) throw new Error('depth ' + r.status);
  const d = await r.json();
  return {
    bids: d.bids.map(b => ({ p: +b[0], q: +b[1] })),
    asks: d.asks.map(a => ({ p: +a[0], q: +a[1] }))
  };
}

async function fetchAggTrades(symbol, limit) {
  const r = await fetch(`${BASE}/api/v3/aggTrades?symbol=${symbol}&limit=${limit}`);
  if (!r.ok) throw new Error('aggTrades ' + r.status);
  const d = await r.json();
  return d.map(t => ({ p: +t.p, q: +t.q, t: +t.T, m: t.m }));
}

async function fetch24h(symbol) {
  const r = await fetch(`${BASE}/api/v3/ticker/24hr?symbol=${symbol}`);
  if (!r.ok) throw new Error('ticker ' + r.status);
  const d = await r.json();
  return {
    price: +d.lastPrice, change: +d.priceChangePercent,
    high: +d.highPrice, low: +d.lowPrice, vol: +d.quoteVolume
  };
}

/* ============================================================
   ORDER BOOK ANALYSIS
   ============================================================ */
function analyzeOrderBook(depth) {
  const bids = depth.bids, asks = depth.asks;
  const mid = (bids[0].p + asks[0].p) / 2;
  const spread = asks[0].p - bids[0].p;
  const spreadPct = (spread / mid) * 100;

  function imbalance(level) {
    let bv = 0, av = 0;
    for (let i = 0; i < Math.min(level, bids.length); i++) bv += bids[i].q;
    for (let i = 0; i < Math.min(level, asks.length); i++) av += asks[i].q;
    const total = bv + av;
    return total > 0 ? (bv - av) / total : 0;
  }

  let totalBidVol = 0, totalAskVol = 0;
  for (const b of bids) totalBidVol += b.p * b.q;
  for (const a of asks) totalAskVol += a.p * a.q;

  function findWalls(orders, side) {
    return [...orders].sort((a, b) => (b.p * b.q) - (a.p * a.q)).slice(0, 3).map(o => ({
      price: o.p, notional: o.p * o.q, distance: Math.abs(o.p - mid) / mid * 100, side
    }));
  }

  return {
    mid, spread, spreadPct, spreadPips: spread,
    imb5: imbalance(5), imb20: imbalance(20), imb50: imbalance(50),
    totalBidVol, totalAskVol, totalVol: totalBidVol + totalAskVol,
    bidWalls: findWalls(bids, 'bid'), askWalls: findWalls(asks, 'ask'),
    topBids: bids.slice(0, 15), topAsks: asks.slice(0, 15)
  };
}

/* ============================================================
   LIQUIDITY MAP — BSL/SSL + Pools
   ============================================================ */
function buildLiquidityMap(klines, currentPrice) {
  const n = klines.length;
  const lookback = Math.min(100, n - 3);

  // Find swing highs (BSL) and swing lows (SSL) across last 100 bars
  const swingHighs = [], swingLows = [];
  for (let i = lookback; i < n - 2; i++) {
    let isH = true, isL = true;
    for (let j = 1; j <= 2; j++) {
      if (i - j < 0 || i + j >= n) continue;
      if (klines[i].h <= klines[i-j].h || klines[i].h <= klines[i+j].h) isH = false;
      if (klines[i].l >= klines[i-j].l || klines[i].l >= klines[i+j].l) isL = false;
    }
    if (isH) swingHighs.push({ price: klines[i].h, index: i });
    if (isL) swingLows.push({ price: klines[i].l, index: i });
  }

  // Cluster nearby swings (within 0.3%) — these are liquidity pools
  function cluster(swings, tolerance) {
    const clusters = [];
    const used = new Array(swings.length).fill(false);
    for (let i = 0; i < swings.length; i++) {
      if (used[i]) continue;
      const group = [swings[i]];
      used[i] = true;
      for (let j = i + 1; j < swings.length; j++) {
        if (used[j]) continue;
        if (Math.abs(swings[j].price - swings[i].price) / swings[i].price <= tolerance) {
          group.push(swings[j]);
          used[j] = true;
        }
      }
      if (group.length >= 1) {
        clusters.push({
          price: group.reduce((s, g) => s + g.price, 0) / group.length,
          count: group.length,
          lastTouch: Math.max(...group.map(g => g.index))
        });
      }
    }
    return clusters;
  }

  const bslClusters = cluster(swingHighs, 0.003)
    .filter(c => c.price > currentPrice)
    .sort((a, b) => a.price - b.price);

  const sslClusters = cluster(swingLows, 0.003)
    .filter(c => c.price < currentPrice)
    .sort((a, b) => b.price - a.price);

  // Estimate liquidity at each level from historical volume near that price
  function estimateLiquidity(level, tolerance = 0.005) {
    let volume = 0, touches = 0;
    for (const bar of klines) {
      if (Math.abs(bar.h - level) / level < tolerance || Math.abs(bar.l - level) / level < tolerance) {
        volume += bar.v * bar.c;
        touches++;
      }
      // Volume traded through the level
      if (bar.h >= level && bar.l <= level) volume += bar.v * bar.c;
    }
    return { volume, touches };
  }

  const bsl = bslClusters.slice(0, 5).map(c => {
    const liq = estimateLiquidity(c.price);
    return { ...c, estimatedLiquidity: liq.volume, touches: liq.touches };
  });

  const ssl = sslClusters.slice(0, 5).map(c => {
    const liq = estimateLiquidity(c.price);
    return { ...c, estimatedLiquidity: liq.volume, touches: liq.touches };
  });

  // Round number levels (psychological + liquidation magnets)
  const magnitude = Math.pow(10, Math.floor(Math.log10(currentPrice)));
  const roundStep = magnitude * 0.01;
  const roundLevels = [];
  const start = Math.floor(currentPrice / roundStep) * roundStep;
  for (let i = -3; i <= 3; i++) {
    roundLevels.push(start + i * roundStep);
  }

  return { bsl, ssl, roundLevels, swingHighs, swingLows };
}

/* ============================================================
   LIQUIDATION ZONES — estimated from structure
   ============================================================ */
function estimateLiquidationZones(liquidityMap, currentPrice, klines) {
  // Long liquidations cluster BELOW swing lows (where long stops are)
  // Short liquidations cluster ABOVE swing highs (where short stops are)
  // Volume of liquidations ≈ volume traded at those levels × leverage multiplier

  const longLiq = [];
  const shortLiq = [];

  for (const level of liquidityMap.ssl.slice(0, 4)) {
    // Every stop below a swing low is a long liquidation
    const estimate = level.estimatedLiquidity * 2.5; // assume 3-5x leverage average
    longLiq.push({
      price: level.price,
      type: 'LONG_LIQ',
      estimate,
      distance: ((currentPrice - level.price) / currentPrice * 100).toFixed(2)
    });
  }

  for (const level of liquidityMap.bsl.slice(0, 4)) {
    const estimate = level.estimatedLiquidity * 2.5;
    shortLiq.push({
      price: level.price,
      type: 'SHORT_LIQ',
      estimate,
      distance: ((level.price - currentPrice) / currentPrice * 100).toFixed(2)
    });
  }

  return { longLiq, shortLiq };
}

/* ============================================================
   ORDER FLOW
   ============================================================ */
function analyzeOrderFlow(trades) {
  let buyVol = 0, sellVol = 0, largeBuys = 0, largeSells = 0;
  const cvdSeries = [];
  let cvd = 0;

  for (const t of trades) {
    const notional = t.p * t.q;
    if (t.m) { // isBuyerMaker = true means seller was aggressive
      sellVol += notional;
      cvd -= notional;
      if (notional > 50000) largeSells += notional;
    } else {
      buyVol += notional;
      cvd += notional;
      if (notional > 50000) largeBuys += notional;
    }
    cvdSeries.push(cvd);
  }

  const totalVol = buyVol + sellVol;
  const delta = buyVol - sellVol;
  const buyRatio = totalVol > 0 ? buyVol / totalVol : 0.5;

  // Delta trend (last 20% vs previous)
  const split = Math.floor(trades.length * 0.2);
  const firstChunk = cvdSeries[split] || 0;
  const lastChunk = cvdSeries[cvdSeries.length - 1] || 0;
  const deltaTrend = lastChunk - firstChunk;

  return {
    buyVol, sellVol, delta, buyRatio, cvd, deltaTrend,
    largeBuys, largeSells,
    totalTrades: trades.length
  };
}

/* ============================================================
   VOLUME PROFILE
   ============================================================ */
function analyzeVolume(klines, currentPrice) {
  const recent = klines.slice(-100);
  const last = klines[klines.length - 1];
  const last20 = klines.slice(-20);
  const avgVol = last20.reduce((s, k) => s + k.v, 0) / last20.length;
  const volMultiple = avgVol > 0 ? last.v / avgVol : 0;

  const high = Math.max(...recent.map(k => k.h));
  const low = Math.min(...recent.map(k => k.l));
  const buckets = 30;
  const bucketSize = (high - low) / buckets;
  const volumeAtPrice = new Array(buckets).fill(0);

  for (const k of recent) {
    const midPrice = (k.h + k.l) / 2;
    const idx = Math.min(buckets - 1, Math.floor((midPrice - low) / bucketSize));
    volumeAtPrice[idx] += k.v;
  }

  let pocIdx = 0, pocVol = 0;
  for (let i = 0; i < volumeAtPrice.length; i++) {
    if (volumeAtPrice[i] > pocVol) { pocVol = volumeAtPrice[i]; pocIdx = i; }
  }
  const poc = low + (pocIdx + 0.5) * bucketSize;

  const totalVol = volumeAtPrice.reduce((s, v) => s + v, 0);
  const target = totalVol * 0.7;
  let acc = volumeAtPrice[pocIdx];
  let upIdx = pocIdx, downIdx = pocIdx;
  while (acc < target) {
    const upVol = upIdx + 1 < volumeAtPrice.length ? volumeAtPrice[upIdx + 1] : 0;
    const downVol = downIdx - 1 >= 0 ? volumeAtPrice[downIdx - 1] : 0;
    if (upVol > downVol && upIdx + 1 < volumeAtPrice.length) { upIdx++; acc += upVol; }
    else if (downIdx - 1 >= 0) { downIdx--; acc += downVol; }
    else break;
  }
  const vah = low + (upIdx + 1) * bucketSize;
  const val = low + downIdx * bucketSize;

  const body = Math.abs(last.c - last.o);
  const range = last.h - last.l;
  const bodyRatio = range > 0 ? body / range : 0;
  const cPos = range > 0 ? (last.c - last.l) / range : 0.5;
  const lastBuyRatio = last.v > 0 ? last.tb / last.v : 0.5;

  let absorption = null;
  if (volMultiple >= 2.0 && bodyRatio < 0.35) {
    if (cPos < 0.4 && lastBuyRatio > 0.55) absorption = 'BULLISH_ABSORPTION';
    else if (cPos > 0.6 && lastBuyRatio < 0.45) absorption = 'BEARISH_ABSORPTION';
  }

  return { volMultiple, poc, vah, val, inValueArea: currentPrice >= val && currentPrice <= vah,
           abovePOC: currentPrice > poc, lastBuyRatio, absorption, volumeAtPrice };
}

/* ============================================================
   STRUCTURE
   ============================================================ */
function analyzeStructure(klines) {
  const n = klines.length;

  function findSwings(lookback) {
    const highs = [], lows = [];
    for (let i = lookback; i < klines.length - lookback; i++) {
      let isH = true, isL = true;
      for (let j = 1; j <= lookback; j++) {
        if (klines[i].h <= klines[i-j].h || klines[i].h <= klines[i+j].h) isH = false;
        if (klines[i].l >= klines[i-j].l || klines[i].l >= klines[i+j].l) isL = false;
      }
      if (isH) highs.push({ i, price: klines[i].h });
      if (isL) lows.push({ i, price: klines[i].l });
    }
    return { highs, lows };
  }

  const swings = findSwings(2);
  const lastHighs = swings.highs.slice(-5);
  const lastLows = swings.lows.slice(-5);
  const lastBar = klines[n - 1];
  const prevBar = klines[n - 2];

  let bosBull = false, bosBear = false;
  if (lastHighs.length > 0) {
    const lh = lastHighs[lastHighs.length - 1];
    if (lastBar.c > lh.price && prevBar.c <= lh.price) bosBull = true;
  }
  if (lastLows.length > 0) {
    const ll = lastLows[lastLows.length - 1];
    if (lastBar.c < ll.price && prevBar.c >= ll.price) bosBear = true;
  }

  let chochBull = false, chochBear = false;
  if (bosBull && lastHighs.length >= 2 && lastHighs[lastHighs.length - 2].price < lastHighs[lastHighs.length - 1].price) chochBull = true;
  if (bosBear && lastLows.length >= 2 && lastLows[lastLows.length - 2].price > lastLows[lastLows.length - 1].price) chochBear = true;

  let fvgBull = null, fvgBear = null;
  for (let i = n - 5; i < n; i++) {
    if (klines[i].l > klines[i-2].h) fvgBull = { top: klines[i].l, bottom: klines[i-2].h, age: n - 1 - i };
    if (klines[i].h < klines[i-2].l) fvgBear = { top: klines[i-2].l, bottom: klines[i].h, age: n - 1 - i };
  }

  const recentHigh = Math.max(...klines.slice(-20).map(k => k.h));
  const recentLow = Math.min(...klines.slice(-20).map(k => k.l));
  const equilibrium = (recentHigh + recentLow) / 2;

  let sweepHigh = false, sweepLow = false, sweepLevel = null;
  for (const h of lastHighs) {
    if (lastBar.h > h.price && lastBar.c < h.price) { sweepHigh = true; sweepLevel = h.price; }
  }
  for (const l of lastLows) {
    if (lastBar.l < l.price && lastBar.c > l.price) { sweepLow = true; sweepLevel = l.price; }
  }

  return { bosBull, bosBear, chochBull, chochBear, fvgBull, fvgBear,
           inPremium: lastBar.c > equilibrium, inDiscount: lastBar.c < equilibrium, equilibrium,
           sweepHigh, sweepLow, sweepLevel, recentHigh, recentLow, lastBar };
}

/* ============================================================
   MANIPULATION
   ============================================================ */
function detectSpoofing(depthHistory) {
  if (depthHistory.length < 2) return { detected: false, reason: 'building history' };
  const prev = depthHistory[depthHistory.length - 2];
  const curr = depthHistory[depthHistory.length - 1];
  const avgBid = prev.bids.reduce((s, o) => s + o.q, 0) / prev.bids.length || 1;
  const avgAsk = prev.asks.reduce((s, o) => s + o.q, 0) / prev.asks.length || 1;
  const vanished = [];

  for (const po of prev.bids) {
    if (po.q < avgBid * 3) continue;
    if (!curr.bids.find(o => Math.abs(o.p - po.p) < 0.001 && o.q >= po.q * 0.5)) {
      vanished.push({ side: 'bid', price: po.p, qty: po.q });
    }
  }
  for (const po of prev.asks) {
    if (po.q < avgAsk * 3) continue;
    if (!curr.asks.find(o => Math.abs(o.p - po.p) < 0.001 && o.q >= po.q * 0.5)) {
      vanished.push({ side: 'ask', price: po.p, qty: po.q });
    }
  }
  return { detected: vanished.length > 0, count: vanished.length, vanished,
           reason: vanished.length > 0 ? `${vanished.length} large order(s) vanished` : 'no spoofing' };
}

function detectStopHunts(klines) {
  const hunts = [];
  for (let i = 5; i < klines.length; i++) {
    const bar = klines[i];
    const body = Math.abs(bar.c - bar.o);
    const range = bar.h - bar.l;
    if (range === 0) continue;
    let priorHigh = -Infinity, priorLow = Infinity;
    for (let j = i - 5; j < i; j++) {
      if (klines[j].h > priorHigh) priorHigh = klines[j].h;
      if (klines[j].l < priorLow) priorLow = klines[j].l;
    }
    const wickUp = bar.h - Math.max(bar.o, bar.c);
    const wickDown = Math.min(bar.o, bar.c) - bar.l;
    if (bar.h > priorHigh && bar.c < priorHigh && wickUp > body * 1.2) {
      hunts.push({ type: 'STOP_HUNT_UP', level: priorHigh, bar: i });
    }
    if (bar.l < priorLow && bar.c > priorLow && wickDown > body * 1.2) {
      hunts.push({ type: 'STOP_HUNT_DOWN', level: priorLow, bar: i });
    }
  }
  return hunts.slice(-3);
}

/* ============================================================
   DECISION ENGINE
   Scores all factors. Produces BUY/SELL/WAIT.
   ============================================================ */
function decide(ob, of, vol, struct, spoof, hunts, price) {
  const factors = [];
  let score = 0;

  function add(name, direction, weight, detail) {
    // direction: 'bull' | 'bear' | 'neutral'
    if (direction === 'bull') score += weight;
    else if (direction === 'bear') score -= weight;
    factors.push({ name, direction, weight, detail });
  }

  // 1. Order Book Imbalance
  if (ob.imb20 > 0.20) add('Order Book Imbalance', 'bull', 2, `+${(ob.imb20*100).toFixed(0)}% bids dominant (20 levels)`);
  else if (ob.imb20 > 0.10) add('Order Book Imbalance', 'bull', 1, `+${(ob.imb20*100).toFixed(0)}% bids dominant`);
  else if (ob.imb20 < -0.20) add('Order Book Imbalance', 'bear', 2, `${(ob.imb20*100).toFixed(0)}% asks dominant (20 levels)`);
  else if (ob.imb20 < -0.10) add('Order Book Imbalance', 'bear', 1, `${(ob.imb20*100).toFixed(0)}% asks dominant`);
  else add('Order Book Imbalance', 'neutral', 0, `balanced (${(ob.imb20*100).toFixed(0)}%)`);

  // 2. Cumulative Delta
  if (of.cvd > of.buyVol * 0.15) add('Cumulative Delta', 'bull', 2, `CVD +${fmt(of.cvd)} (strong buying)`);
  else if (of.cvd > 0) add('Cumulative Delta', 'bull', 1, `CVD +${fmt(of.cvd)}`);
  else if (of.cvd < -of.sellVol * 0.15) add('Cumulative Delta', 'bear', 2, `CVD ${fmt(of.cvd)} (strong selling)`);
  else if (of.cvd < 0) add('Cumulative Delta', 'bear', 1, `CVD ${fmt(of.cvd)}`);
  else add('Cumulative Delta', 'neutral', 0, 'balanced');

  // 3. Buy Ratio
  if (of.buyRatio > 0.58) add('Aggressive Buy Ratio', 'bull', 2, `${(of.buyRatio*100).toFixed(0)}% aggressive buys`);
  else if (of.buyRatio > 0.53) add('Aggressive Buy Ratio', 'bull', 1, `${(of.buyRatio*100).toFixed(0)}% buys`);
  else if (of.buyRatio < 0.42) add('Aggressive Buy Ratio', 'bear', 2, `${(of.buyRatio*100).toFixed(0)}% aggressive sells`);
  else if (of.buyRatio < 0.47) add('Aggressive Buy Ratio', 'bear', 1, `${(of.buyRatio*100).toFixed(0)}% sells`);
  else add('Aggressive Buy Ratio', 'neutral', 0, `balanced (${(of.buyRatio*100).toFixed(0)}%)`);

  // 4. BOS
  if (struct.bosBull) add('Break of Structure', 'bull', 2, 'BOS up');
  else if (struct.bosBear) add('Break of Structure', 'bear', 2, 'BOS down');
  else add('Break of Structure', 'neutral', 0, 'no BOS');

  // 5. CHoCH
  if (struct.chochBull) add('Change of Character', 'bull', 2, 'CHoCH up (bullish reversal)');
  else if (struct.chochBear) add('Change of Character', 'bear', 2, 'CHoCH down (bearish reversal)');
  else add('Change of Character', 'neutral', 0, 'no reversal');

  // 6. Sweep
  if (struct.sweepLow) add('Liquidity Sweep', 'bull', 2, `swept SSL @ ${fmt(struct.sweepLevel)}`);
  else if (struct.sweepHigh) add('Liquidity Sweep', 'bear', 2, `swept BSL @ ${fmt(struct.sweepLevel)}`);
  else add('Liquidity Sweep', 'neutral', 0, 'no sweep');

  // 7. Premium / Discount
  if (struct.inDiscount) add('Premium/Discount', 'bull', 1, 'price in discount zone');
  else if (struct.inPremium) add('Premium/Discount', 'bear', 1, 'price in premium zone');
  else add('Premium/Discount', 'neutral', 0, 'near equilibrium');

  // 8. Volume Profile position
  if (vol.abovePOC) add('Volume Profile', 'bull', 1, `above POC (${fmt(vol.poc)})`);
  else add('Volume Profile', 'bear', 1, `below POC (${fmt(vol.poc)})`);

  // 9. Volume absorption
  if (vol.absorption === 'BULLISH_ABSORPTION') add('Volume Absorption', 'bull', 2, 'bullish absorption detected');
  else if (vol.absorption === 'BEARISH_ABSORPTION') add('Volume Absorption', 'bear', 2, 'bearish absorption detected');
  else add('Volume Absorption', 'neutral', 0, 'none');

  // 10. FVG
  if (struct.fvgBull && struct.fvgBull.age <= 3) add('Fair Value Gap', 'bull', 1, 'recent bullish FVG');
  else if (struct.fvgBear && struct.fvgBear.age <= 3) add('Fair Value Gap', 'bear', 1, 'recent bearish FVG');
  else add('Fair Value Gap', 'neutral', 0, 'no recent FVG');

  // 11. Spoofing (negative for both sides)
  if (spoof.detected) add('Spoofing Detection', 'neutral', 0, `${spoof.count} order(s) vanished — be careful`);

  // 12. Recent stop hunts
  if (hunts.length > 0) {
    const lastHunt = hunts[hunts.length - 1];
    if (lastHunt.type === 'STOP_HUNT_DOWN') add('Stop Hunt', 'bull', 1, `swept lows @ ${fmt(lastHunt.level)}`);
    else add('Stop Hunt', 'bear', 1, `swept highs @ ${fmt(lastHunt.level)}`);
  }

  // DECISION
  const maxPossible = 15;
  const confidence = Math.min(100, Math.abs(score) / maxPossible * 100);
  let action, reason;

  if (score >= 6) { action = 'BUY'; reason = `${score} bullish factors aligned — strong long setup`; }
  else if (score <= -6) { action = 'SELL'; reason = `${Math.abs(score)} bearish factors aligned — strong short setup`; }
  else if (score >= 3) { action = 'WAIT'; reason = `${score} bullish factors — not enough confirmations for BUY (need +6)`; }
  else if (score <= -3) { action = 'WAIT'; reason = `${Math.abs(score)} bearish factors — not enough confirmations for SELL (need -6)`; }
  else { action = 'WAIT'; reason = `Only ${Math.abs(score)} factors aligned — market is unclear`; }

  return { action, score, confidence, reason, factors };
}

/* ============================================================
   TRADE LEVELS
   ============================================================ */
function buildTradeLevels(action, price, struct, ob, liquidityMap, atr) {
  if (action === 'WAIT') return null;

  if (action === 'BUY') {
    let stop = price - atr * 1.5;
    if (struct.sweepLow && struct.sweepLevel) stop = Math.min(stop, struct.sweepLevel - atr * 0.3);
    if (liquidityMap.ssl.length > 0) stop = Math.min(stop, liquidityMap.ssl[0].price - atr * 0.3);

    const risk = price - stop;
    const tp1 = price + risk * 1.5;
    const tp2 = price + risk * 2.5;
    const tp3 = price + risk * 4.0;

    return { entry: price, stop, tp1, tp2, tp3, rr: (tp2 - price) / risk, risk };
  } else {
    let stop = price + atr * 1.5;
    if (struct.sweepHigh && struct.sweepLevel) stop = Math.max(stop, struct.sweepLevel + atr * 0.3);
    if (liquidityMap.bsl.length > 0) stop = Math.max(stop, liquidityMap.bsl[0].price + atr * 0.3);

    const risk = stop - price;
    const tp1 = price - risk * 1.5;
    const tp2 = price - risk * 2.5;
    const tp3 = price - risk * 4.0;

    return { entry: price, stop, tp1, tp2, tp3, rr: (price - tp2) / risk, risk };
  }
}

function calcATR(klines, period = 14) {
  let sum = 0, cnt = 0;
  for (let i = Math.max(1, klines.length - period); i < klines.length; i++) {
    sum += Math.max(klines[i].h - klines[i].l,
                     Math.abs(klines[i].h - klines[i-1].c),
                     Math.abs(klines[i].l - klines[i-1].c));
    cnt++;
  }
  return cnt > 0 ? sum / cnt : 1;
}

/* ============================================================
   RENDER
   ============================================================ */
async function run() {
  const sym = document.getElementById('sym').value;
  STATE.symbol = sym;
  const btn = document.getElementById('btnRun');
  btn.disabled = true;
  btn.textContent = 'Analyzing…';
  document.getElementById('auto').textContent = 'fetching…';

  try {
    log('Analyzing ' + sym + '…', 'ok');
    const [klines1h, klines15m, depth, trades, ticker] = await Promise.all([
      fetchKlines(sym, '1h', 200),
      fetchKlines(sym, '15m', 100),
      fetchDepth(sym, 100),
      fetchAggTrades(sym, 1000),
      fetch24h(sym)
    ]);

    // Store depth snapshot for spoofing detection
    STATE.depthHistory.push({
      time: Date.now(),
      bids: depth.bids.slice(0, 20),
      asks: depth.asks.slice(0, 20)
    });
    while (STATE.depthHistory.length > 20) STATE.depthHistory.shift();

    log('Data loaded: ' + klines1h.length + ' 1h, ' + trades.length + ' trades', 'ok');

    // Run all engines
    const ob = analyzeOrderBook(depth);
    const of = analyzeOrderFlow(trades);
    const vol = analyzeVolume(klines1h, ticker.price);
    const struct = analyzeStructure(klines1h);
    const spoof = detectSpoofing(STATE.depthHistory);
    const hunts = detectStopHunts(klines1h);
    const liquidityMap = buildLiquidityMap(klines1h, ticker.price);
    const liquidationZones = estimateLiquidationZones(liquidityMap, ticker.price, klines1h);
    const atr = calcATR(klines1h);

    // Multi-timeframe confirmation
    const struct15m = analyzeStructure(klines15m);
    const mtfBull = (struct.bosBull || struct.chochBull) && (struct15m.bosBull || struct15m.chochBull);
    const mtfBear = (struct.bosBear || struct.chochBear) && (struct15m.bosBear || struct15m.chochBear);

    // Decision
    const decision = decide(ob, of, vol, struct, spoof, hunts, ticker.price);
    const trade = buildTradeLevels(decision.action, ticker.price, struct, ob, liquidityMap, atr);

    render(ticker, ob, of, vol, struct, spoof, hunts, decision, trade, liquidityMap, liquidationZones, atr, mtfBull, mtfBear);
    log('Decision: ' + decision.action + ' (score ' + decision.score + ')', decision.action === 'WAIT' ? 'warn' : 'ok');
    document.getElementById('auto').textContent = 'analyzed at ' + new Date().toLocaleTimeString();
  } catch (e) {
    log('ERROR: ' + e.message, 'err');
    document.getElementById('output').innerHTML = `<div class="card" style="color:var(--red)">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze';
  }
}

  html += '</div>';

  // ============ MANIPULATION ============
  html += '<div class="card">';
  html += '<h2 style="margin-top:0">Manipulation Detection</h2>';
  html += `<div class="row"><span class="lbl">Spoofing</span><span class="val ${spoof.detected?'purple':'info'}">${spoof.reason}</span></div>`;
  if (spoof.vanished && spoof.vanished.length > 0) {
    for (const v of spoof.vanished.slice(0, 3)) {
      html += `<div class="row"><span class="lbl">${v.side.toUpperCase()} wall @ ${fmt(v.price)}</span><span class="val purple">${fmt(v.qty)} vanished</span></div>`;
    }
  }
  if (hunts.length > 0) {
    html += `<div class="row"><span class="lbl" style="color:var(--purple)">Stop Hunts</span><span class="val purple">${hunts.length} recent</span></div>`;
    for (const h of hunts.reverse()) {
      html += `<div class="row"><span class="lbl">${h.type.replace('_',' ')} @ ${fmt(h.level)}</span></div>`;
    }
  } else {
    html += `<div class="row"><span class="lbl">Stop Hunts</span><span class="val info">none recent</span></div>`;
  }
  html += '</div>';

  // ============ MARKET STATE ============
  html += '<div class="card">';
  html += '<h2 style="margin-top:0">Market State</h2>';
  let state = 'NEUTRAL';
  let stateDesc = '';
  if (struct.inDiscount && vol.volMultiple < 1.2) { state = 'ACCUMULATION'; stateDesc = 'low volume, price in discount — institutions likely accumulating'; }
  else if (struct.inPremium && vol.volMultiple < 1.2) { state = 'DISTRIBUTION'; stateDesc = 'low volume, price in premium — institutions likely distributing'; }
  else if (spoof.detected) { state = 'MANIPULATION'; stateDesc = 'large orders vanishing — fake liquidity present'; }
  else if (vol.volMultiple >= 2.0 && Math.abs(struct.equilibrium - ticker.price) / ticker.price > 0.02) { state = 'EXPANSION'; stateDesc = 'high volume away from equilibrium — trending move'; }
  else if (vol.volMultiple >= 1.5 && vol.inValueArea) { state = 'PREPARING'; stateDesc = 'rising volume in value area — coiling before a move'; }
  html += `<div style="text-align:center;font-size:20px;font-weight:800;color:var(--cyan);padding:12px 0">${state}</div>`;
  html += `<div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px">${stateDesc}</div>`;
  html += '</div>';

  out.innerHTML = html;
}

  log('Decision Engine ready', 'ok');

  run();
  setInterval(() => { if (!document.hidden) run(); }, 30000);
});
