<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Test Harness</title>
<style>
  body { background: #080a0f; color: #e8ecf1; font-family: ui-monospace, Menlo, monospace; padding: 16px; font-size: 13px; line-height: 1.6; }
  h1 { font-size: 16px; color: #06b6d4; margin-bottom: 8px; letter-spacing: 1.5px; }
  button { padding: 12px 24px; background: #0ecb81; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin: 12px 0; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .section { background: #12171f; padding: 14px; border-radius: 8px; margin: 12px 0; }
  .pass { color: #0ecb81; }
  .fail { color: #f6465d; }
  .warn { color: #f0b90b; }
  .info { color: #7a8698; }
  .big { font-size: 22px; font-weight: bold; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
</style>
</head>
<body>
<h1>AI TEST HARNESS</h1>
<p class="info">Answers: Does the AI produce real predictive signal, or is it noise?</p>
<button id="runBtn" onclick="runTest()">Run AI Test</button>
<div id="output"></div>

<script>
'use strict';

const out = () => document.getElementById('output');
const log = (msg, cls = '') => {
  out().innerHTML += '<div class="' + cls + '">' + msg + '</div>';
};
const clear = () => { out().innerHTML = ''; };

/* ---------- Decision Tree ---------- */
class DecisionTree {
  constructor(maxDepth, minSamples) {
    this.maxDepth = maxDepth;
    this.minSamples = minSamples;
    this.root = null;
  }
  fit(X, y) { this.root = this._build(X, y, 0); }
  _build(X, y, depth) {
    const n = X.length;
    if (n === 0) return { leaf: true, prob: 0.5 };
    const d = X[0].length;
    let c0 = 0, c1 = 0;
    for (let i = 0; i < y.length; i++) { if (y[i] === 1) c1++; else c0++; }
    if (depth >= this.maxDepth || n < this.minSamples || c0 === 0 || c1 === 0) {
      return { leaf: true, prob: c1 / n };
    }
    const parentG = 1 - Math.pow(c0 / n, 2) - Math.pow(c1 / n, 2);
    let bestGain = 0, bestF = -1, bestT = 0;
    for (let f = 0; f < d; f++) {
      const vals = X.map(r => r[f]);
      const uniq = Array.from(new Set(vals)).sort((a, b) => a - b);
      const step = Math.max(1, Math.floor(uniq.length / 8));
      for (let i = step; i < uniq.length; i += step) {
        const th = uniq[i];
        let l0 = 0, l1 = 0, r0 = 0, r1 = 0;
        for (let j = 0; j < n; j++) {
          if (X[j][f] <= th) { if (y[j] === 1) l1++; else l0++; }
          else { if (y[j] === 1) r1++; else r0++; }
        }
        const L = l0 + l1, R = r0 + r1;
        if (L < this.minSamples || R < this.minSamples) continue;
        const gain = parentG
          - (L / n) * (1 - Math.pow(l0 / L, 2) - Math.pow(l1 / L, 2))
          - (R / n) * (1 - Math.pow(r0 / R, 2) - Math.pow(r1 / R, 2));
        if (gain > bestGain) { bestGain = gain; bestF = f; bestT = th; }
      }
    }
    if (bestGain === 0 || bestF === -1) return { leaf: true, prob: c1 / n };
    const LX = [], LY = [], RX = [], RY = [];
    for (let i = 0; i < n; i++) {
      if (X[i][bestF] <= bestT) { LX.push(X[i]); LY.push(y[i]); }
      else { RX.push(X[i]); RY.push(y[i]); }
    }
    return {
      leaf: false, feature: bestF, threshold: bestT,
      left: this._build(LX, LY, depth + 1),
      right: this._build(RX, RY, depth + 1)
    };
  }
  predict(x) {
    let node = this.root;
    while (!node.leaf) {
      if (x[node.feature] <= node.threshold) node = node.left;
      else node = node.right;
    }
    return node.prob;
  }
}

/* ---------- Random Forest ---------- */
class RandomForest {
  constructor(nTrees, maxDepth, minSamples) {
    this.nTrees = nTrees;
    this.maxDepth = maxDepth;
    this.minSamples = minSamples;
    this.trees = [];
  }
  fit(X, y) {
    this.trees = [];
    for (let t = 0; t < this.nTrees; t++) {
      const Xb = [], Yb = [];
      for (let i = 0; i < X.length; i++) {
        const k = Math.floor(Math.random() * X.length);
        Xb.push(X[k]); Yb.push(y[k]);
      }
      const tree = new DecisionTree(this.maxDepth, this.minSamples);
      tree.fit(Xb, Yb);
      this.trees.push(tree);
    }
  }
  predict(x) {
    let s = 0;
    for (let i = 0; i < this.trees.length; i++) s += this.trees[i].predict(x);
    return s / this.trees.length;
  }
}

/* ---------- Logistic Regression ---------- */
class LogisticRegression {
  constructor(lr, epochs, l2) {
    this.lr = lr; this.epochs = epochs; this.l2 = l2; this.w = null;
  }
  fit(X, y) {
    const n = X.length, d = X[0].length;
    this.w = new Array(d).fill(0);
    const sig = z => 1 / (1 + Math.exp(-Math.max(-20, Math.min(20, z))));
    for (let e = 0; e < this.epochs; e++) {
      for (let i = 0; i < n; i++) {
        let z = 0;
        for (let j = 0; j < d; j++) z += this.w[j] * X[i][j];
        const p = sig(z), err = p - y[i];
        for (let j = 0; j < d; j++) this.w[j] -= this.lr * (err * X[i][j] + this.l2 * this.w[j]);
      }
    }
  }
  predict(x) {
    let z = 0;
    for (let j = 0; j < x.length; j++) z += this.w[j] * x[j];
    return 1 / (1 + Math.exp(-Math.max(-20, Math.min(20, z))));
  }
}

/* ---------- Ensemble ---------- */
class Ensemble {
  constructor() {
    this.rf = new RandomForest(15, 5, 8);
    this.lr = new LogisticRegression(0.1, 150, 0.01);
  }
  fit(X, y) {
    this.rf.fit(X, y);
    this.lr.fit(X, y);
  }
  predict(x) {
    return this.rf.predict(x) * 0.6 + this.lr.predict(x) * 0.4;
  }
}

/* ---------- Feature Extraction (7 simple features) ---------- */
function extractFeatures(klines, i) {
  const o = +klines[i][1], h = +klines[i][2], l = +klines[i][3], c = +klines[i][4];
  const v = +klines[i][5], tb = +klines[i][9];
  const range = h - l;
  const cPos = range > 0 ? (c - l) / range : 0.5;
  const body = Math.abs(c - o);

  let volBase = 0, cnt = 0;
  for (let j = Math.max(0, i - 20); j < i; j++) { volBase += +klines[j][5]; cnt++; }
  volBase = cnt > 0 ? volBase / cnt : 0;
  const volMult = volBase > 0 ? v / volBase : 1;
  const buyRatio = v > 0 ? tb / v : 0.5;

  let atr = 0, atrCnt = 0;
  for (let j = Math.max(1, i - 13); j <= i; j++) {
    atr += Math.max(
      +klines[j][2] - +klines[j][3],
      Math.abs(+klines[j][2] - +klines[j-1][4]),
      Math.abs(+klines[j][3] - +klines[j-1][4])
    );
    atrCnt++;
  }
  atr = atrCnt > 0 ? atr / atrCnt : 1;
  const bodyATR = body / atr;

  const ref20 = +klines[Math.max(0, i - 20)][4];
  const htfUp = c > ref20 ? 1 : 0;

  return [volMult, bodyATR, cPos, buyRatio, htfUp, body / (c || 1), range / (c || 1)];
}

/* ---------- Triple-Barrier Label ---------- */
function tripleBarrier(klines, i, profitMult, stopMult, maxHold) {
  const c = +klines[i][4];
  let atr = 0, cnt = 0;
  for (let j = Math.max(1, i - 13); j <= i; j++) {
    atr += Math.max(
      +klines[j][2] - +klines[j][3],
      Math.abs(+klines[j][2] - +klines[j-1][4]),
      Math.abs(+klines[j][3] - +klines[j-1][4])
    );
    cnt++;
  }
  atr = cnt > 0 ? atr / cnt : 1;

  const upper = c + atr * profitMult;
  const lower = c - atr * stopMult;
  const end = Math.min(i + maxHold, klines.length - 1);

  for (let j = i + 1; j <= end; j++) {
    const cc = +klines[j][4];
    if (cc >= upper) return 1;
    if (cc <= lower) return 0;
  }
  return 0;
}

/* ---------- Metrics ---------- */
function metrics(yTrue, yPred) {
  let tp = 0, tn = 0, fp = 0, fn = 0;
  for (let i = 0; i < yTrue.length; i++) {
    if (yTrue[i] === 1 && yPred[i] === 1) tp++;
    else if (yTrue[i] === 0 && yPred[i] === 0) tn++;
    else if (yTrue[i] === 0 && yPred[i] === 1) fp++;
    else fn++;
  }
  const tot = tp + tn + fp + fn;
  const acc = tot > 0 ? (tp + tn) / tot : 0;
  const prec = (tp + fp) > 0 ? tp / (tp + fp) : 0;
  const rec = (tp + fn) > 0 ? tp / (tp + fn) : 0;
  const f1 = (prec + rec) > 0 ? 2 * prec * rec / (prec + rec) : 0;
  return { acc, prec, rec, f1, tp, tn, fp, fn };
}

/* ---------- Main Test ---------- */
async function runTest() {
  clear();
  document.getElementById('runBtn').disabled = true;

  try {
    log('<div class="section">Fetching BTC/USDT 1h data from Binance...</div>', 'info');
    const res = await fetch('https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1000');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const klines = await res.json();

    if (klines.length < 200) throw new Error('Not enough data: ' + klines.length + ' bars');
    log('<div class="section">Loaded ' + klines.length + ' bars of BTC/USDT 1h</div>', 'pass');

    // Build samples
    const X = [], y = [];
    for (let i = 60; i < klines.length - 6; i++) {
      X.push(extractFeatures(klines, i));
      y.push(tripleBarrier(klines, i, 1.5, 1.0, 6));
    }

    const total = y.length;
    let positives = 0;
    for (let i = 0; i < y.length; i++) positives += y[i];
    const negCount = total - positives;

    log('<div class="section">', '');
    log('Samples: ' + total, '');
    log('Profit labels (1): ' + positives + ' (' + (positives / total * 100).toFixed(1) + '%)', '');
    log('Loss labels (0): ' + negCount + ' (' + (negCount / total * 100).toFixed(1) + '%)', '');
    log('</div>', '');

    // 70/30 time split (no shuffle - critical for time series)
    const split = Math.floor(total * 0.7);
    const Xtrain = X.slice(0, split), ytrain = y.slice(0, split);
    const Xtest = X.slice(split), ytest = y.slice(split);

    log('<div class="section">', '');
    log('Train samples: ' + Xtrain.length, '');
    log('Test samples:  ' + Xtest.length, '');
    log('</div>', '');

    // Train
    const t0 = performance.now();
    const model = new Ensemble();
    model.fit(Xtrain, ytrain);
    const trainMs = performance.now() - t0;
    log('<div class="section">Training time: ' + trainMs.toFixed(0) + 'ms ' + (trainMs < 3000 ? '✓' : '⚠ slow') + '</div>', trainMs < 3000 ? 'pass' : 'warn');

    // Predict
    const t1 = performance.now();
    const preds = Xtest.map(x => model.predict(x) > 0.5 ? 1 : 0);
    const predMs = performance.now() - t1;
    log('<div class="section">Prediction time: ' + predMs.toFixed(0) + 'ms</div>', 'info');

    // Metrics
    const m = metrics(ytest, preds);
    log('<div class="section">', '');
    log('<b>RESULTS</b>', '');
    log('Accuracy:  ' + (m.acc * 100).toFixed(1) + '% ' + (m.acc > 0.55 ? '✓ above 55%' : '✗ below 55%'), m.acc > 0.55 ? 'pass' : 'fail');
    log('Precision: ' + (m.prec * 100).toFixed(1) + '% (of predicted wins, how many were real)', '');
    log('Recall:    ' + (m.rec * 100).toFixed(1) + '% (of real wins, how many were caught)', '');
    log('F1 Score:  ' + (m.f1 * 100).toFixed(1) + '%', '');
    log('', '');
    log('Confusion Matrix:', '');
    log('  True Positives:  ' + m.tp, '');
    log('  True Negatives:  ' + m.tn, '');
    log('  False Positives: ' + m.fp, '');
    log('  False Negatives: ' + m.fn, '');
    log('</div>', '');

    // Baseline comparison - THE most important part
    const baseline = Math.max(positives / total, 1 - positives / total);
    const edge = m.acc - baseline;

    log('<div class="section">', '');
    log('<b>BASELINE COMPARISON</b>', '');
    log('Baseline (always predict majority class): ' + (baseline * 100).toFixed(1) + '%', '');
    log('Model accuracy: ' + (m.acc * 100).toFixed(1) + '%', '');
    log('Edge over baseline: ' + (edge * 100).toFixed(1) + ' percentage points', '');
    log('</div>', '');

    // Verdict
    log('<div class="section">', '');
    log('<b>VERDICT</b>', '');
    if (edge > 0.02 && m.acc > 0.55) {
      log('✓ The AI produces real signal.', 'pass');
      log('  It beats baseline by ' + (edge * 100).toFixed(1) + '% and beats 55% threshold.', 'pass');
      log('  The approach is viable. Build on it.', 'pass');
    } else if (edge > 0.005) {
      log('⚠ The AI is barely better than random.', 'warn');
      log('  Edge of only ' + (edge * 100).toFixed(1) + '% over baseline.', 'warn');
      log('  Needs better features, more data, or regime-specific models.', 'warn');
    } else {
      log('✗ The AI is NOT better than baseline.', 'fail');
      log('  The current features, labels, or model architecture do not work.', 'fail');
      log('  Do not build a trading system on this yet.', 'fail');
    }
    log('</div>', '');

    // What to do next
    log('<div class="section">', '');
    log('<b>WHAT TO DO NEXT</b>', '');
    log('1. If accuracy > 55% and edge > 2%: The AI works. Proceed to build the signal engine.', '');
    log('2. If accuracy 52-55% or edge 0.5-2%: Improve features. Try adding funding rate, BTC dominance, more SMC features.', '');
    log('3. If accuracy < 52% or edge < 0.5%: The labels or features need rethinking.', '');
    log('   Try different triple-barrier settings (profitMult=2.0, maxHold=12).', '');
    log('4. In ALL cases: verify on a different symbol (ETHUSDT) before trusting it.', '');
    log('</div>', '');

  } catch (e) {
    log('<div class="section fail">ERROR: ' + e.message + '</div>', 'fail');
  }

  document.getElementById('runBtn').disabled = false;
}
</script>
</body>
</html>
