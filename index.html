<script>
"use strict";
const CRYPTO=[["BTCUSDT","Bitcoin"],["ETHUSDT","Ethereum"],["BNBUSDT","BNB"],["SOLUSDT","Solana"],["XRPUSDT","XRP"],["ADAUSDT","Cardano"],["DOGEUSDT","Dogecoin"],["AVAXUSDT","Avalanche"],["TRXUSDT","TRON"],["DOTUSDT","Polkadot"],["LINKUSDT","Chainlink"],["TONUSDT","Toncoin"],["SHIBUSDT","Shiba"],["LTCUSDT","Litecoin"],["BCHUSDT","BitcoinCash"],["UNIUSDT","Uniswap"],["ATOMUSDT","Cosmos"],["XLMUSDT","Stellar"],["ETCUSDT","EthClassic"],["NEARUSDT","NEAR"]];
const FX=[["EURUSD=X","EUR/USD"],["GBPUSD=X","GBP/USD"],["JPY=X","USD/JPY"],["AUDUSD=X","AUD/USD"],["USDCAD=X","USD/CAD"],["USDCHF=X","USD/CHF"]];

const INDICES=[["DX-Y.NYB","Dollar Index"],["^GSPC","S&P 500"],["^NDX","Nasdaq 100"],["^DJI","Dow Jones"],["CL=F","Crude Oil"],["^VIX","VIX"]];
const MARKETS={crypto:CRYPTO,fx:FX,metal:METALS,index:INDICES};
const YAHOO_INTERVAL={"1m":"1m","5m":"5m","15m":"15m","1h":"60m","4h":"1h","1d":"1d"};

const $=id=>document.getElementById(id);
const symEl=$('sym'),pxEl=$('px'),chgEl=$('chg'),listEl=$('list'),stEl=$('st');
const sigsEl=$('sigs'),biasEl=$('bias');
const pSignal=$('p-signal'),pVolume=$('p-volume'),pCvd=$('p-cvd'),pLiq=$('p-liq'),
      pSmc=$('p-smc'),pWyckoff=$('p-wyckoff'),pSessions=$('p-sessions'),
      pHistory=$('p-history'),pAlerts=$('p-alerts');

let interval='1m',market='crypto',current=null,currentName='',candles=[];
let klineWS=null,tickWS=null,yahooTimer=null,futWs=null,liqWs=null;
let futCvdSeries=[],futCvdTotal=0,liqs=[];

/* Watchlist */
const rowMap={};
function buildList(){
  listEl.innerHTML='';
  Object.keys(rowMap).forEach(k=>delete rowMap[k]);
  MARKETS[market].forEach(([s,n])=>{
    const row=document.createElement('div');

}

function fmt(n){
  if(!isFinite(n))return '—';
  if(n>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:2});
  if(n>=1)return n.toFixed(2);
  if(n>=0.01)return n.toFixed(4);
  return n.toFixed(6);
}
function pct(n){return (n>=0?'+':'')+n.toFixed(2)+'%';}

/* Charts */
const baseOpts={layout:{background:{color:'#0b0e11'},textColor:'#d1d4dc',fontSize:10},
  grid:{vertLines:{color:'#161a25'},horzLines:{color:'#161a25'}},
  rightPriceScale:{borderColor:'#2a2e39'},
  timeScale:{borderColor:'#2a2e39',timeVisible:true,secondsVisible:false,rightOffset:4,barSpacing:5}};
const chart=LightweightCharts.createChart($('main'),baseOpts);
const rsiChart=LightweightCharts.createChart($('rsi'),{...baseOpts,timeScale:{...baseOpts.timeScale,visible:false}});
const macdChart=LightweightCharts.createChart($('macd'),{...baseOpts,timeScale:{...baseOpts.timeScale,visible:false}});
const stochChart=LightweightCharts.createChart($('stoch'),baseOpts);
const candleSeries=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderUpColor:'#26a69a',borderDownColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const ema20=chart.addLineSeries({color:'#2962ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const ema50=chart.addLineSeries({color:'#ff9800',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const ema200=chart.addLineSeries({color:'#9c27b0',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const bbU=chart.addLineSeries({color:'#787b86',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const bbL=chart.addLineSeries({color:'#787b86',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const volSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'v',priceLineVisible:false,lastValueVisible:false});
chart.priceScale('v').applyOptions({scaleMargins:{top:0.82,bottom:0}});
const rsiLine=rsiChart.addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const rsi70=rsiChart.addLineSeries({color:'#5e6673',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const rsi30=rsiChart.addLineSeries({color:'#5e6673',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const macdLine=macdChart.addLineSeries({color:'#2962ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const sigLine=macdChart.addLineSeries({color:'#ff9800',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const macdHist=macdChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false});
const kLine=stochChart.addLineSeries({color:'#2962ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const dLine=stochChart.addLineSeries({color:'#ff9800',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
let srLines=[],liqLines=[];
function clearSR(){srLines.forEach(l=>{try{candleSeries.removePriceLine(l);}catch(e){}});srLines=[];}
function clearLiq(){liqLines.forEach(l=>{try{candleSeries.removePriceLine(l);}catch(e){}});liqLines=[];}

function resize(){
  chart.applyOptions({width:$('main').clientWidth,height:$('main').clientHeight});
  rsiChart.applyOptions({width:$('rsi').clientWidth,height:$('rsi').clientHeight});

window.addEventListener('resize',resize);

/* Indicators */
function ema(v,p){const o=new Array(v.length).fill(null);if(v.length<p)return o;const k=2/(p+1);let s=0;for(let i=0;i<p;i++)s+=v[i];let prev=s/p;o[p-1]=prev;for(let i=p;i<v.length;i++){prev=v[i]*k+prev*(1-k);o[i]=prev;}return o;}
function sma(v,p){const o=new Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=p)s-=v[i-p];if(i>=p-1)o[i]=s/p;}return o;}
function stdev(v,p){const o=new Array(v.length).fill(null);const m=sma(v,p);for(let i=p-1;i<v.length;i++){let s=0;for(let j=i-p+1;j<=i;j++)s+=Math.pow(v[j]-m[i],2);o[i]=Math.sqrt(s/p);}return o;}
function rsiCalc(v,p){p=p||14;const o=new Array(v.length).fill(null);if(v.length<=p)return o;let g=0,l=0;for(let i=1;i<=p;i++){const d=v[i]-v[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/p,al=l/p;o[p]=al===0?100:100-100/(1+ag/al);for(let i=p+1;i<v.length;i++){const d=v[i]-v[i-1];const gg=d>0?d:0,ll=d<0?-d:0;ag=(ag*(p-1)+gg)/p;al=(al*(p-1)+ll)/p;o[i]=al===0?100:100-100/(1+ag/al);}return o;}
function macdCalc(v){const e12=ema(v,12),e26=ema(v,26);const line=v.map((_,i)=>(e12[i]!=null&&e26[i]!=null)?e12[i]-e26[i]:null);const clean=line.map(x=>x==null?0:x);const sig=ema(clean,9).map((x,i)=>line[i]==null?null:x);const hist=line.map((x,i)=>(x!=null&&sig[i]!=null)?x-sig[i]:null);return {line,sig,hist};}
function stochCalc(c,p,d){p=p||14;d=d||3;const kArr=new Array(c.length).fill(null);for(let i=p-1;i<c.length;i++){let hh=-Infinity,ll=Infinity;for(let j=i-p+1;j<=i;j++){if(c[j].high>hh)hh=c[j].high;if(c[j].low<ll)ll=c[j].low;}const denom=hh-ll;kArr[i]=denom===0?50:((c[i].close-ll)/denom)*100;}const cleanK=kArr.map(x=>x==null?50:x);const dArr=sma(cleanK,d).map((x,i)=>kArr[i]==null?null:x);return {k:kArr,d:dArr};}
function atrCalc(c,p){p=p||14;const tr=c.map((x,i)=>{if(i===0)return x.high-x.low;const pc=c[i-1].close;return Math.max(x.high-x.low,Math.abs(x.high-pc),Math.abs(x.low-pc));});const o=new Array(c.length).fill(null);if(c.length<p)return o;let s=0;for(let i=0;i<p;i++)s+=tr[i];let prev=s/p;o[p-1]=prev;for(let i=p;i<c.length;i++){prev=(prev*(p-1)+tr[i])/p;o[i]=prev;}return o;}

/* SMC */
function detectSwings(c,p){p=p||5;const highs=[],lows=[];for(let i=p;i<c.length-p;i++){let isH=true,isL=true;for(let j=i-p;j<=i+p;j++){if(c[j].high>c[i].high)isH=false;if(c[j].low<c[i].low)isL=false;}if(isH)highs.push({i,price:c[i].high});if(isL)lows.push({i,price:c[i].low});}return {highs,lows};}
function detectStructure(c){const {highs,lows}=detectSwings(c,5);const events=[];let lastDir=null;const ordered=[...highs.map(h=>({...h,type:'H'})),...lows.map(l=>({...l,type:'L'}))].sort((a,b)=>a.i-b.i);for(let k=1;k<ordered.length;k++){const prev=ordered[k-1],cur=ordered[k];if(prev.type==='H'&&cur.type==='H'&&cur.price>prev.price){events.push({i:cur.i,type:'BOS',dir:'up'});lastDir='up';}else if(prev.type==='L'&&cur.type==='L'&&cur.price<prev.price){events.push({i:cur.i,type:'BOS',dir:'down'});lastDir='down';}else if(lastDir&&prev.type==='H'&&cur.type==='L'&&cur.price<prev.price&&lastDir==='up'){events.push({i:cur.i,type:'CHoCH',dir:'down'});lastDir='down';}else if(lastDir&&prev.type==='L'&&cur.type==='H'&&cur.price>prev.price&&lastDir==='down'){events.push({i:cur.i,type:'CHoCH',dir:'up'});lastDir='up';}}return events;}
function detectFVGs(c){const fvgs=[];for(let i=2;i<c.length;i++){if(c[i-2].high<c[i].low)fvgs.push({high:c[i].low,low:c[i-2].high,dir:'bull'});if(c[i-2].low>c[i].high)fvgs.push({high:c[i-2].low,low:c[i].high,dir:'bear'});}return fvgs.slice(-10);}
function detectSweeps(c){const {highs,lows}=detectSwings(c,5);const s=[];highs.filter(h=>h.i>=c.length-120).forEach(h=>{for(let i=h.i+1;i<Math.min(c.length,h.i+20);i++){if(c[i].high>h.price&&c[i].close<h.price){s.push({i,type:'Buy-side sweep',dir:'up'});break;}}});lows.filter(l=>l.i>=c.length-120).forEach(l=>{for(let i=l.i+1;i<Math.min(c.length,l.i+20);i++){if(c[i].low<l.price&&c[i].close>l.price){s.push({i,type:'Sell-side sweep',dir:'down'});break;}}});return s;}

/* Wyckoff / CRT */
function wyckoffPhase(c){const slice=c.slice(-60);const closes=slice.map(x=>x.close);const vols=slice.map(x=>x.volume);const avgVol=vols.reduce((a,b)=>a+b,0)/vols.length;const recentVol=vols.slice(-5).reduce((a,b)=>a+b,0)/5;const last20=Math.max(...closes.slice(-20))-Math.min(...closes.slice(-20));const prior40=Math.max(...closes.slice(-60,-20))-Math.min(...closes.slice(-60,-20));const contr=last20<prior40*0.6,exp=last20>prior40*1.4;const trend=ema(closes,20)[closes.length-1]-ema(closes,50)[closes.length-1];let phase='Unclear';if(contr&&recentVol<avgVol)phase='Accumulation / Distribution range';else if(exp&&trend>0)phase='Markup (trend up)';else if(exp&&trend<0)phase='Markdown (trend down)';else if(Math.abs(trend)<(Math.max(...closes)-Math.min(...closes))*0.02)phase='Ranging';else phase=trend>0?'Bullish continuation':'Bearish continuation';return {phase,contr,exp,avgVol,recentVol};}
function crtState(c){const r=c.slice(-40).map(x=>x.high-x.low);const recent=r.slice(-10).reduce((a,b)=>a+b,0)/10;const prior=r.slice(-30,-10).reduce((a,b)=>a+b,0)/20;if(recent<prior*0.65)return {state:'Contraction',note:'Range compressing — breakout likely soon'};if(recent>prior*1.5)return {state:'Expansion',note:'Range expanding — trend in motion'};return {state:'Normal',note:'Range within normal bounds'};}

/* Sessions */
const SESSIONS=[{name:'Asian',start:0,end:8},{name:'London',start:7,end:16},{name:'NY AM',start:13,end:17},{name:'NY PM',start:17,end:21},{name:'London Close',start:15,end:17}];
function currentSession(){const h=new Date().getUTCHours();for(const s of SESSIONS){if(h>=s.start&&h<s.end)return s;}return null;}

/* CVD spot */
function cvdFromCandles(c){let cum=0;const s=[];c.forEach(x=>{const r=(x.high-x.low)||1e-9;const b=x.volume*((x.close-x.low)/r);cum+=(b-(x.volume-b));s.push({time:x.time,value:cum});});return s;}
function detectDivergence(c,s){if(c.length<20)return null;const ps=c[0].close,pe=c[c.length-1].close;const cs=s[0].value,ce=s[s.length-1].value;const pu=pe>ps,cu=ce>cs;if(pu&&!cu)return 'Price rising but CVD falling — bearish divergence.';if(!pu&&cu)return 'Price falling but CVD rising — bullish divergence.';return null;}

/* Data: crypto */
async function fetchCryptoHistory(sym){
  const url='https://api.binance.com/api/v3/klines?symbol='+sym+'&interval='+interval+'&limit=1000';
  const raw=await (await fetch(url)).json();
  return raw.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
}
function startCryptoTicker(){
  if(tickWS){try{tickWS.close();}catch(e){}}
  const streams=MARKETS.crypto.map(s=>s[0].toLowerCase()+'@miniTicker').join('/');
  tickWS=new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams);
  tickWS.onmessage=e=>{const m=JSON.parse(e.data).data;const s=m.s;if(!rowMap[s])return;const p=parseFloat(m.c),o=parseFloat(m.o);const pctv=((p-o)/o)*100;rowMap[s].price.textContent=fmt(p);rowMap[s].chg.textContent=(pctv>=0?'+':'')+pctv.toFixed(2)+'%';rowMap[s].chg.className='c '+(pctv>=0?'up':'down');if(s===current){pxEl.textContent=fmt(p);pxEl.className=pctv>=0?'up':'down';chgEl.textContent=(pctv>=0?'+':'')+pctv.toFixed(2)+'%';}checkAlerts(p);};
  tickWS.onopen=()=>stEl.textContent='ticker live';
  tickWS.onerror=()=>stEl.textContent='ticker error';
}
function startCryptoKline(sym){
  if(klineWS){try{klineWS.close();}catch(e){}}
  klineWS=new WebSocket('wss://stream.binance.com:9443/ws/'+sym.toLowerCase()+'@kline_'+interval);
  klineWS.onmessage=e=>{const k=JSON.parse(e.data).k;const c={time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};if(candles.length&&candles[candles.length-1].time===c.time)candles[candles.length-1]=c;else{candles.push(c);if(candles.length>1500)candles.shift();}candleSeries.update(c);volSeries.update({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(38,166,154,0.4)':'rgba(239,83,80,0.4)'});pxEl.textContent=fmt(c.close);pxEl.className=c.close>=c.open?'up':'down';drawIndicators(true);analyze();};
  klineWS.onopen=()=>stEl.textContent=currentName+' live';
}

/* Data: yahoo (forex/metals/indices) */
async function fetchYahooHistory(sym){
  const yi=YAHOO_INTERVAL[interval]||'1m';
  const url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?interval='+yi+'&range=5d';
  const proxied='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
  const res=await fetch(proxied);
  const json=await res.json();
  const r=json.chart&&json.chart.result&&json.chart.result[0];
  if(!r)throw new Error('Yahoo data unavailable');
  const ts=r.timestamp||[];
  const q=r.indicators.quote[0];
  const out=[];
  for(let i=0;i<ts.length;i++){
    if(q.open[i]==null||q.high[i]==null||q.low[i]==null||q.close[i]==null)continue;
    out.push({time:ts[i],open:q.open[i],high:q.high[i],low:q.low[i],close:q.close[i],volume:q.volume[i]||0});
  }
  return out;
}
function startYahooPoll(sym){
  if(yahooTimer){clearInterval(yahooTimer);yahooTimer=null;}
  yahooTimer=setInterval(async()=>{
    try{
      const fresh=await fetchYahooHistory(sym);
      if(!fresh.length)return;
      candles=fresh;
      candleSeries.setData(candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
      volSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(38,166,154,0.4)':'rgba(239,83,80,0.4)'})));
      drawIndicators();drawSR();
      const last=candles[candles.length-1];
      pxEl.textContent=fmt(last.close);
      if(rowMap[sym]){rowMap[sym].price.textContent=fmt(last.close);}
      analyze();
    }catch(e){stEl.textContent='poll error';}
  },15000);
}

/* Futures CVD */
function startFuturesCVD(sym){
  if(futWs){try{futWs.close();}catch(e){}}
  futCvdSeries=[];futCvdTotal=0;
  futWs=new WebSocket('wss://fstream.binance.com/ws/'+sym.toLowerCase()+'@aggTrade');
  futWs.onmessage=e=>{const d=JSON.parse(e.data);if(!d.p||!d.q)return;const qty=parseFloat(d.q);const signed=d.m?-qty:qty;futCvdTotal+=signed;const t=Math.floor(d.T/1000);if(futCvdSeries.length&&futCvdSeries[futCvdSeries.length-1].time===t)futCvdSeries[futCvdSeries.length-1].value=futCvdTotal;else{futCvdSeries.push({time:t,value:futCvdTotal});if(futCvdSeries.length>500)futCvdSeries.shift();}};
  futWs.onerror=()=>{};
}

/* Liquidations */
function startLiquidationFeed(){
  if(liqWs){try{liqWs.close();}catch(e){}}
  liqs=[];
  const streams=MARKETS.crypto.map(s=>s[0].toLowerCase()+'@forceOrder').join('/');
  liqWs=new WebSocket('wss://fstream.binance.com/stream?streams='+streams);
  liqWs.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data).data;
      const o=msg.o;
      if(!o)return;
      const sym=o.s;
      const side=o.S;
      const qty=parseFloat(o.q);
      const price=parseFloat(o.ap)||parseFloat(o.p);
      const usd=qty*price;
      liqs.push({time:Date.now(),sym,side,price,qty,usd});
      if(liqs.length>500)liqs.shift();
      if(document.getElementById('p-liq').classList.contains('on'))renderLiq();
    }catch(err){}
  };
  liqWs.onerror=()=>{};
}

/* Load symbol */
async function selectSymbol(sym,name){
  current=sym;currentName=name;
  Object.values(rowMap).forEach(r=>r.row.classList.remove('sel'));
  if(rowMap[sym])rowMap[sym].row.classList.add('sel');
  symEl.textContent=name+' · '+interval;
  pxEl.textContent='—';pxEl.className='';chgEl.textContent='';
  stEl.textContent='loading '+name+'…';
  biasEl.textContent='Analyzing…';biasEl.className='bias neut';
  sigsEl.innerHTML='';
  [pSignal,pVolume,pCvd,pLiq,pSmc,pWyckoff,pSessions,pHistory].forEach(p=>p.innerHTML='Loading…');

  if(klineWS){try{klineWS.close();}catch(e){}klineWS=null;}
  if(yahooTimer){clearInterval(yahooTimer);yahooTimer=null;}
  clearSR();

  try{
    if(market==='crypto'){
      candles=await fetchCryptoHistory(sym);
      startCryptoKline(sym);
      startFuturesCVD(sym);
    } else {
      candles=await fetchYahooHistory(sym);
      startYahooPoll(sym);
    }
  }catch(e){
    stEl.textContent='load error: '+e.message;
    return;
  }

  candleSeries.setData(candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
  volSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(38,166,154,0.4)':'rgba(239,83,80,0.4)'})));
  drawIndicators();drawSR();drawLiqMarkers();
  chart.timeScale().fitContent();
  const last=candles[candles.length-1];
  if(last)pxEl.textContent=fmt(last.close);
  stEl.textContent=name+' loaded';
  analyze();
}

function drawIndicators(isLive){
  if(candles.length<5)return;
  const closes=candles.map(c=>c.close);
  const e20=ema(closes,20),e50=ema(closes,50),e200=ema(closes,200);
  const mid=sma(closes,20),sd=stdev(closes,20);
  const bU=mid.map((m,i)=>(m!=null&&sd[i]!=null)?m+2*sd[i]:null);
  const bL=mid.map((m,i)=>(m!=null&&sd[i]!=null)?m-2*sd[i]:null);
  ema20.setData(candles.map((c,i)=>e20[i]!=null?{time:c.time,value:e20[i]}:null).filter(Boolean));
  ema50.setData(candles.map((c,i)=>e50[i]!=null?{time:c.time,value:e50[i]}:null).filter(Boolean));
  ema200.setData(candles.map((c,i)=>e200[i]!=null?{time:c.time,value:e200[i]}:null).filter(Boolean));
  bbU.setData(candles.map((c,i)=>bU[i]!=null?{time:c.time,value:bU[i]}:null).filter(Boolean));
  bbL.setData(candles.map((c,i)=>bL[i]!=null?{time:c.time,value:bL[i]}:null).filter(Boolean));
  const r=rsiCalc(closes,14);
  rsiLine.setData(candles.map((c,i)=>r[i]!=null?{time:c.time,value:r[i]}:null).filter(Boolean));
  if(!isLive){rsi70.setData(candles.map(c=>({time:c.time,value:70})));rsi30.setData(candles.map(c=>({time:c.time,value:30})));}
  const m=macdCalc(closes);
  macdLine.setData(candles.map((c,i)=>m.line[i]!=null?{time:c.time,value:m.line[i]}:null).filter(Boolean));
  sigLine.setData(candles.map((c,i)=>m.sig[i]!=null?{time:c.time,value:m.sig[i]}:null).filter(Boolean));
  macdHist.setData(candles.map((c,i)=>m.hist[i]!=null?{time:c.time,value:m.hist[i],color:m.hist[i]>=0?'rgba(38,166,154,0.6)':'rgba(239,83,80,0.6)'}:null).filter(Boolean));
  const st=stochCalc(candles,14,3);
  kLine.setData(candles.map((c,i)=>st.k[i]!=null?{time:c.time,value:st.k[i]}:null).filter(Boolean));
  dLine.setData(candles.map((c,i)=>st.d[i]!=null?{time:c.time,value:st.d[i]}:null).filter(Boolean));
}

function drawSR(){
  clearSR();
  if(candles.length<30)return;
  const {highs,lows}=detectSwings(candles,5);
  highs.slice(-2).forEach(h=>srLines.push(candleSeries.createPriceLine({price:h.price,color:'#ef5350',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'R'})));
  lows.slice(-2).forEach(l=>srLines.push(candleSeries.createPriceLine({price:l.price,color:'#26a69a',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'S'})));
}

/* Analyze */
function analyze(){
  if(candles.length<60)return;
  const closes=candles.map(c=>c.close);
  const n=closes.length;
  const price=closes[n-1];
  const e20=ema(closes,20)[n-1];
  const e50=ema(closes,50)[n-1];
  const r=rsiCalc(closes,14)[n-1];
  const m=macdCalc(closes);
  const histNow=m.hist[n-1],histPrev=m.hist[n-2];
  const mid=sma(closes,20),sd=stdev(closes,20);
  const midNow=mid[n-1],sdNow=sd[n-1];
  const bbUp=midNow+2*sdNow,bbDn=midNow-2*sdNow;
  const vols=candles.map(c=>c.volume);
  let avgVol=0;for(let i=n-21;i<n-1;i++)avgVol+=vols[i];avgVol/=20;
  const volRatio=vols[n-1]/avgVol;

  const sigs=[];let bull=0,bear=0;
  if(e20>e50){sigs.push(['g','Trend','EMA20 above EMA50 — uptrend']);bull++;}else{sigs.push(['r','Trend','EMA20 below EMA50 — downtrend']);bear++;}
  if(r>=70)sigs.push(['r','RSI '+r.toFixed(1),'Overbought — reversal risk rising']);
  else if(r<=30)sigs.push(['g','RSI '+r.toFixed(1),'Oversold — sell pressure exhausting']);
  else if(r>55){sigs.push(['g','RSI '+r.toFixed(1),'Above midline — buyers in control']);bull++;}
  else if(r<45){sigs.push(['r','RSI '+r.toFixed(1),'Below midline — sellers in control']);bear++;}
  else sigs.push(['y','RSI '+r.toFixed(1),'Neutral — no edge']);
  if(histNow>0&&histPrev<=0){sigs.push(['g','MACD','Bullish crossover just fired']);bull++;}
  else if(histNow<0&&histPrev>=0){sigs.push(['r','MACD','Bearish crossover just fired']);bear++;}
  else if(histNow>0){sigs.push(['g','MACD','Histogram positive — bullish momentum']);bull++;}
  else{sigs.push(['r','MACD','Histogram negative — bearish momentum']);bear++;}
  if(price>=bbUp)sigs.push(['r','Bollinger','Price above upper band']);
  else if(price<=bbDn)sigs.push(['g','Bollinger','Price below lower band']);
  if(volRatio>=1.5)sigs.push(['g','Volume',volRatio.toFixed(2)+'× avg — strong']);
  else if(volRatio>=0.7)sigs.push(['y','Volume',volRatio.toFixed(2)+'× avg — normal']);
  else sigs.push(['r','Volume',volRatio.toFixed(2)+'× avg — thin']);

  const sess=currentSession();
  if(sess)sigs.push(['y','Session',sess.name+' live now (UTC)']);

  let biasText,biasClass;
  if(bull>bear&&bull>=3){biasText='BULLISH bias — '+bull+' of 5 checks favor up';biasClass='bias bull';}
  else if(bear>bull&&bear>=3){biasText='BEARISH bias — '+bear+' of 5 checks favor down';biasClass='bias bear';}
  else{biasText='MIXED / NO CLEAR EDGE';biasClass='bias neut';}
  biasEl.textContent=biasText;biasEl.className=biasClass;
  sigsEl.innerHTML=sigs.map(s=>'<div class="sig"><div class="dot '+s[0]+'"></div><div><b>'+s[1]+'</b> — <span>'+s[2]+'</span></div></div>').join('');

  renderSignal(bull,bear,volRatio,price);
  renderVolume(price);
  renderCVD();
  renderLiq();
  renderSMC();
  renderWyckoff();
  renderSessions();
  renderHistory();
}

const row=(k,v,c)=>'<div class="kv"><span>'+k+'</span><span class="'+(c||'')+'">'+v+'</span></div>';

function renderSignal(bull,bear,volRatio,price){
  const n=candles.length;
  const atr=atrCalc(candles,14)[n-1]||0;
  const total=bull+bear;
  const conf=Math.round(Math.abs((total?bull/total:0.5)-0.5)*200);
  const dir=bull>bear?'UP':bear>bull?'DOWN':'NEUTRAL';
  const dc=dir==='UP'?'pos':dir==='DOWN'?'neg':'warn';
  let html='<div class="card"><h4>Direction</h4>';
  html+=row('Bias',dir,dc);
  html+=row('Confidence',conf+'%',conf>=60?'pos':conf>=35?'warn':'neg');
  html+=row('Volume',volRatio.toFixed(2)+'× avg',volRatio>=1.2?'pos':volRatio>=0.7?'warn':'neg');
  html+='</div>';
  if(dir!=='NEUTRAL'){
    const m1=atr,m2=atr*2,m3=atr*3;
    const tp1=dir==='UP'?price+m1:price-m1;
    const tp2=dir==='UP'?price+m2:price-m2;
    const tp3=dir==='UP'?price+m3:price-m3;
    const inv=dir==='UP'?price-m1:price+m1;
    html+='<div class="card"><h4>Targets (ATR = '+atr.toFixed(4)+')</h4>';
    html+=row('Entry',fmt(price));
    html+=row('TP1',fmt(tp1),'pos');
    html+=row('TP2',fmt(tp2),'pos');
    html+=row('TP3',fmt(tp3),'pos');
    html+=row('Stop',fmt(inv),'neg');
    html+=row('R:R (to TP2)','2.00 R','pos');
    html+='</div>';
  } else html+='<div class="card">No directional edge.</div>';
  html+='<div style="color:#5e6673;font-size:10px">ATR-based estimates, not guarantees.</div>';
  pSignal.innerHTML=html;
}

function renderVolume(price){
  const n=candles.length;
  if(n<30){pVolume.innerHTML='Not enough data.';return;}
  let buy=0,sell=0,cum=0;
  candles.forEach(c=>{const r=(c.high-c.low)||1e-9;const b=c.volume*((c.close-c.low)/r);buy+=b;sell+=c.volume-b;cum+=(b-(c.volume-b));});
  const total=buy+sell;
  const bp=total?buy/total*100:50,sp=100-bp;
  let av=0;for(let i=n-21;i<n-1;i++)av+=candles[i].volume;av/=20;
  const lv=candles[n-1].volume;
  const ratio=lv/av;
  const last=candles[n-1];
  const body=Math.abs(last.close-last.open);
  const rng=(last.high-last.low)||1e-9;
  const abs=ratio>=1.5&&(body/rng)<0.35;
  const start=Math.max(0,n-200);
  const slice=candles.slice(start);
  let lo=Infinity,hi=-Infinity;
  slice.forEach(c=>{if(c.low<lo)lo=c.low;if(c.high>hi)hi=c.high;});
  const bins=24,step=(hi-lo)/bins||1;
  const prof=new Array(bins).fill(0);
  slice.forEach(c=>{const mid=(c.high+c.low)/2;let i=Math.floor((mid-lo)/step);if(i<0)i=0;if(i>=bins)i=bins-1;prof[i]+=c.volume;});
  let pi=0;for(let i=1;i<bins;i++)if(prof[i]>prof[pi])pi=i;
  const poc=lo+(pi+0.5)*step;
  const tot=prof.reduce((a,b)=>a+b,0);
  let t=tot*0.7,vv=prof[pi],up=pi,dn=pi;
  while(vv<t&&(up<bins-1||dn>0)){const u=up<bins-1?prof[up+1]:-1;const d=dn>0?prof[dn-1]:-1;if(u>=d&&up<bins-1){up++;vv+=u;}else if(dn>0){dn--;vv+=d;}else break;}
  const vah=lo+(up+1)*step,val=lo+dn*step;
  const inVA=price>=val&&price<=vah;
  let html='<div class="card"><h4>Buy / Sell split</h4>';
  html+='<div class="bar"><div class="buy" style="width:'+bp+'%"></div><div class="sell" style="width:'+sp+'%"></div></div>';
  html+=row('Buy',bp.toFixed(1)+'%','pos');
  html+=row('Sell',sp.toFixed(1)+'%','neg');
  html+=row('Cum delta',(cum>=0?'+':'')+cum.toFixed(0),cum>=0?'pos':'neg');
  html+='</div>';
  html+='<div class="card"><h4>Current bar</h4>';
  html+=row('Last vol',lv.toFixed(2));
  html+=row('20-bar avg',av.toFixed(2));
  html+=row('Ratio',ratio.toFixed(2)+'×',ratio>=1.5?'pos':ratio>=0.7?'warn':'neg');
  html+=row('Absorption',abs?'YES':'no',abs?'warn':'');
  html+='</div>';
  html+='<div class="card"><h4>Volume profile (last 200)</h4>';
  html+=row('POC',fmt(poc),'warn');
  html+=row('VA high',fmt(vah),'neg');
  html+=row('VA low',fmt(val),'pos');
  html+=row('In value area',inVA?'YES':'NO');
  html+='</div>';
  pVolume.innerHTML=html;
}

function renderCVD(){
  const n=candles.length;
  if(n<30){pCvd.innerHTML='Not enough data.';return;}
  const series=cvdFromCandles(candles);
  const last=series[series.length-1].value;
  const ago=series[Math.max(0,series.length-20)].value;
  const slope=last-ago;
  const div=detectDivergence(candles.slice(-30),series.slice(-30));
  let html='<div class="card"><h4>Spot CVD</h4>';
  html+=row('Current',last.toFixed(0),last>=0?'pos':'neg');
  html+=row('20-bar change',(slope>=0?'+':'')+slope.toFixed(0),slope>=0?'pos':'neg');
  html+='</div>';
  html+='<div class="card"><h4>Futures CVD (live)</h4>';
  if(futCvdSeries.length===0)html+='<div style="color:#848e9c">Connecting to futures feed…</div>';
  else{
    const fl=futCvdSeries[futCvdSeries.length-1].value;
    const fa=futCvdSeries[Math.max(0,futCvdSeries.length-20)].value;
    const fs=fl-fa;
    html+=row('Current',fl.toFixed(0),fl>=0?'pos':'neg');
    html+=row('20-bar change',(fs>=0?'+':'')+fs.toFixed(0),fs>=0?'pos':'neg');
  }
  html+='</div>';
  if(div)html+='<div class="card"><h4>Divergence</h4><div style="color:#f0b90b">'+div+'</div></div>';
  html+='<div style="color:#5e6673;font-size:10px">Spot CVD approximated. Futures CVD real tick from Binance USD-M.</div>';
  pCvd.innerHTML=html;
}

function renderLiq(){
  const n=liqs.length;
  let html='';
  html+='<div class="card"><h4>Liquidation feed (Binance Futures)</h4>';
  if(n===0){
    html+='<div style="color:#848e9c">Waiting for liquidation events… This may take a minute on quiet markets.</div>';
  } else {
    const now=Date.now();
    const recent=liqs.filter(l=>now-l.time<15*60*1000);
    const longs=recent.filter(l=>l.side==='SELL');  // a SELL force order closes a long
    const shorts=recent.filter(l=>l.side==='BUY');
    const longUSD=longs.reduce((a,b)=>a+b.usd,0);
    const shortUSD=shorts.reduce((a,b)=>a+b.usd,0);
    html+=row('Events (last 15m)',recent.length);
    html+=row('Long liquidations',fmt(longUSD)+' USD',longUSD>shortUSD?'neg':'');
    html+=row('Short liquidations',fmt(shortUSD)+' USD',shortUSD>longUSD?'pos':'');
    if(longUSD>shortUSD*1.5)html+='<div style="color:#ef5350;margin-top:4px">Longs are being squeezed — downward cascade pressure.</div>';
    else if(shortUSD>longUSD*1.5)html+='<div style="color:#26a69a;margin-top:4px">Shorts are being squeezed — upward cascade pressure.</div>';
    html+='</div>';

    // Big single liquidations
    const big=recent.slice().sort((a,b)=>b.usd-a.usd).slice(0,8);
    html+='<div class="card"><h4>Largest (last 15m)</h4>';
    big.forEach(l=>{
      const dt=new Date(l.time).toLocaleTimeString();
      html+=row(dt+' '+l.sym,(l.side==='SELL'?'Long ':'Short ')+fmt(l.usd)+' USD',l.side==='SELL'?'neg':'pos');
    });
    html+='</div>';

    // Clusters — group by price band
    if(candles.length){
      const lo=Math.min(...candles.slice(-200).map(c=>c.low));
      const hi=Math.max(...candles.slice(-200).map(c=>c.high));
      const bins=20,step=(hi-lo)/bins||1;
      const heat=new Array(bins).fill(0);
      recent.forEach(l=>{
        let i=Math.floor((l.price-lo)/step);
        if(i<0)i=0;if(i>=bins)i=bins-1;
        heat[i]+=l.usd;
      });
      html+='<div class="card"><h4>Liquidation zones (price clusters)</h4>';
      for(let i=bins-1;i>=0;i--){
        if(heat[i]>0){
          const pLow=lo+i*step,pHigh=lo+(i+1)*step;
          html+=row(fmt(pLow)+' – '+fmt(pHigh),fmt(heat[i])+' USD','warn');
        }
      }
      html+='<div style="color:#848e9c;margin-top:4px">These are zones where leverage was just forcibly closed. Price often revisits these levels.</div>';
      html+='</div>';
    }
  }
  html+='</div>';
  pLiq.innerHTML=html;
}

function renderSMC(){
  const n=candles.length;
  if(n<80){pSmc.innerHTML='Not enough data.';return;}
  const structure=detectStructure(candles).slice(-8).reverse();
  const fvgs=detectFVGs(candles).slice(-5);
  const sweeps=detectSweeps(candles).slice(-5);
  let html='<div class="card"><h4>Market structure</h4>';
  if(!structure.length)html+='<div style="color:#848e9c">No BOS / CHoCH detected.</div>';
  else structure.forEach(e=>{
    const dt=new Date(candles[e.i].time*1000).toLocaleString();
    html+=row(dt+' · '+e.type,e.dir.toUpperCase(),e.dir==='up'?'pos':'neg');
  });
  html+='</div>';
  html+='<div class="card"><h4>Fair value gaps</h4>';
  if(!fvgs.length)html+='<div style="color:#848e9c">None.</div>';
  else fvgs.forEach(f=>{html+=row(f.dir==='bull'?'Bull FVG':'Bear FVG',fmt(f.low)+' – '+fmt(f.high),f.dir==='bull'?'pos':'neg');});
  html+='</div>';
  html+='<div class="card"><h4>Liquidity sweeps (ICT)</h4>';
  if(!sweeps.length)html+='<div style="color:#848e9c">None.</div>';
  else sweeps.forEach(s=>{const dt=new Date(candles[s.i].time*1000).toLocaleString();html+=row(dt,s.type,s.dir==='up'?'neg':'pos');});
  html+='</div>';
  pSmc.innerHTML=html;
}

function renderWyckoff(){
  const n=candles.length;
  if(n<80){pWyckoff.innerHTML='Not enough data.';return;}
  const w=wyckoffPhase(candles);
  const c=crtState(candles);
  let html='<div class="card"><h4>Wyckoff phase</h4>';
  html+=row('Phase',w.phase,w.phase.includes('Accumulation')?'pos':w.phase.includes('Distribution')?'neg':w.phase.includes('Markup')?'pos':w.phase.includes('Markdown')?'neg':'warn');
  html+=row('Recent vol / avg',(w.recentVol/w.avgVol).toFixed(2)+'×');
  html+='</div>';
  html+='<div class="card"><h4>CRT</h4>';
  html+=row('State',c.state,c.state==='Expansion'?'pos':c.state==='Contraction'?'warn':'');
  html+='<div style="color:#848e9c;margin-top:4px">'+c.note+'</div>';
  html+='</div>';
  pWyckoff.innerHTML=html;
}

function renderSessions(){

function renderHistory(){
  const n=candles.length;
  if(n<150){pHistory.innerHTML='Need more history.';return;}
  const closes=candles.map(c=>c.close);
  const rsi=rsiCalc(closes,14);
  const macd=macdCalc(closes);
  const e20=ema(closes,20),e50=ema(closes,50);
  const nowRsi=rsi[n-1],nowHist=macd.hist[n-1];
  const nowTrend=e20[n-1]>e50[n-1]?1:-1;
  const h=20,matches=[];
  for(let i=60;i<n-h;i++){
    if(rsi[i]==null||macd.hist[i]==null)continue;
    const trend=e20[i]>e50[i]?1:-1;
    if(trend!==nowTrend)continue;
    if(Math.abs(rsi[i]-nowRsi)>=8)continue;
    if((macd.hist[i]>=0)!==(nowHist>=0))continue;
    const entry=closes[i],exit=closes[i+h];
    matches.push({i,ret:(exit-entry)/entry*100});
  }
  if(!matches.length){pHistory.innerHTML='<div class="card">No similar setups found.</div>';return;}
  const wins=matches.filter(m=>nowTrend>0?m.ret>0:m.ret<0).length;
  const wr=wins/matches.length*100;
  const avg=matches.reduce((a,b)=>a+b.ret,0)/matches.length;
  let html='<div class="card"><h4>Pattern match</h4>';
  html+=row('Similar',matches.length);
  html+=row('Worked',wins+'/'+matches.length+' ('+wr.toFixed(0)+'%)',wr>=55?'pos':wr>=45?'warn':'neg');
  html+=row('Avg move',pct(avg),avg>=0?'pos':'neg');
  html+='</div>';
  pHistory.innerHTML=html;
}

let alerts=[];
function checkAlerts(price){
  if(!current)return;
  alerts.forEach(a=>{
    if(a.symbol!==current||a.hit)return;
    if((a.dir==='above'&&price>=a.price)||(a.dir==='below'&&price<=a.price)){
      a.hit=true;try{if(navigator.vibrate)navigator.vibrate(200);}catch(e){}
      renderAlerts();
    }
  });
}
function renderAlerts(){
  let html='';
  if(!alerts.length)html='<div style="color:#848e9c">No alerts. Add a level.</div>';
  else alerts.forEach((a,i)=>{
    const dt=new Date(a.created).toLocaleTimeString();
    html+='<div class="alert-item'+(a.hit?' hit':'')+'"><span>'+a.symbol+' '+(a.dir==='above'?'≥':'≤')+' '+fmt(a.price)+' · '+dt+'</span><span class="alert-del" data-i="'+i+'">×</span></div>';
  });
  pAlerts.querySelector('#alertList').innerHTML=html;
  pAlerts.querySelectorAll('.alert-del').forEach(el=>{el.onclick=()=>{alerts.splice(+el.dataset.i,1);renderAlerts();};});
}
$('addAlert').onclick=()=>{
  const v=parseFloat($('alertPrice').value);
  if(isNaN(v)||!current)return;
  const price=parseFloat(pxEl.textContent.replace(/,/g,''))||v;
  alerts.push({symbol:current,price:v,dir:v>price?'above':'below',created:Date.now(),hit:false});
  $('alertPrice').value='';renderAlerts();
};
