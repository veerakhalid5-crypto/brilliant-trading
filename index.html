<script>
/* ================================================================
   INSTITUTIONAL INTELLIGENCE ENGINE
   Modules: Data -> Structure -> OrderFlow -> Regime -> AI -> Fusion
   ================================================================ */

const CFG = {
  topN: 30,
  scanTfs: ["15m","1h","4h"],
  klinesLimit: 500,
  baseRest: "https://data-api.binance.vision",
  wsSpot: "wss://stream.binance.com:9443/ws",
  minProb: 60,
  minScore: 50,
  refreshMs: 300000
};

const STATE = {
  universe: [], results: {}, signals: [], chartSym: null, chartTf: "1h",
  chart: null, candleSeries: null, scanning: false, sigFilter: "all",
  aiModels: {}, obiCache: {}, cvdCache: {}, lastScan: 0
};

const $ = id => document.getElementById(id);
const fmt = n => { if(!isFinite(n)) return "—"; const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(2)+"B"; if(a>=1e6) return (n/1e6).toFixed(2)+"M";
  if(a>=1000) return n.toLocaleString(undefined,{maximumFractionDigits:1});
  if(a>=1) return n.toFixed(3); if(a>=0.01) return n.toFixed(4); return n.toPrecision(4); };
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));

function log(msg, cls) {
  const el = $("debug"); if(!el) return;
  const d = document.createElement("div"); d.className = cls||"ok";
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

/* ================================================================
   MODULE 1: DATA INGESTION
   WebSocket for order flow (CORS-enabled), REST for klines
   ================================================================ */

const cache = new Map();
async function getJSON(url, ttl=60000) {
  const now = Date.now(); const hit = cache.get(url);
  if(hit && now-hit.ts < ttl) return hit.data;
  const r = await fetch(url); if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json(); cache.set(url,{ts:now,data:d}); return d;
}

const STABLES = new Set(["USDC","FDUSD","TUSD","BUSD","DAI","EUR","GBP","PAXG"]);
async function loadUniverse() {
  log("loading universe…","info");
  const t = await getJSON(`${CFG.baseRest}/api/v3/ticker/24hr`,60000);
  const rows = t.filter(x=>x.symbol.endsWith("USDT"))
    .map(x=>({symbol:x.symbol,base:x.symbol.slice(0,-4),price:+x.lastPrice,chg:+x.priceChangePercent,vol:+x.quoteVolume}))
    .filter(x=>!STABLES.has(x.base))
    .sort((a,b)=>b.vol-a.vol).slice(0,CFG.topN);
  STATE.universe = rows; fillChartSelect(); fillResearchSelect();
  log(`universe: ${rows.length} pairs`,"ok"); return rows;
}

/* ================================================================
   MODULE 2: SMC STRUCTURAL ENGINE
   Implements pyvsmc-equivalent primitives deterministically
   ================================================================ */

const sma = (a,i,n) => { let s=0; for(let k=i-n+1;k<=i;k++) s+=a[k]; return s/n; };
const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;

function findSwings(h,l,n=2) {
  const sh=[],sl=[];
  for(let i=n;i<h.length-n;i++){
    let isH=true,isL=true;
    for(let j=1;j<=n;j++){
      if(h[i]<=h[i-j]||h[i]<=h[i+j]) isH=false;
      if(l[i]>=l[i-j]||l[i]>=l[i+j]) isL=false;
    }
    if(isH) sh.push({i,p:h[i]}); if(isL) sl.push({i,p:l[i]});
  }
  return {sh,sl};
}

function smcContext(o,h,l,c,v,last,swings) {
  const {sh,sl}=swings;
  const pSH=sh.filter(s=>s.i<last-1), pSL=sl.filter(s=>s.i<last-1);
  const lSH=pSH.length?pSH[pSH.length-1]:null, lSL=pSL.length?pSL[pSL.length-1]:null;

  // BOS vs CHoCH: BOS continues trend, CHoCH reverses
  let bosBull=false,bosBear=false,chochBull=false,chochBear=false;
  if(lSH && c[last]>lSH.p && c[last-1]<=lSH.p) {
    const prevSH=pSH.length>=2?pSH[pSH.length-2]:null;
    if(prevSH && prevSH.p>lSH.p) bosBull=true; else chochBull=true;
  }
  if(lSL && c[last]<lSL.p && c[last-1]>=lSL.p) {
    const prevSL=pSL.length>=2?pSL[pSL.length-2]:null;
    if(prevSL && prevSL.p<lSL.p) bosBear=true; else chochBear=true;
  }

  // FVG: 3-candle imbalance with displacement
  let fvgBull=false,fvgBear=false;
  for(let i=Math.max(2,last-6);i<=last;i++){
    if(l[i]>h[i-2]) fvgBull=true;
    if(h[i]<l[i-2]) fvgBear=true;
  }

  // Order Block: last opposite candle before displacement, volume-validated
  let obBull=null,obBear=null;
  const bodyLast=Math.abs(c[last]-o[last]);
  const atr=(()=>{let s=0;for(let i=last-13;i<=last;i++)s+=(h[i]-l[i]);return s/14;})();
  const disp=bodyLast/(atr||1);
  const volBase=sma(v,last-1,20);
  const volMult=volBase>0?v[last]/volBase:0;
  if(disp>1.3 && volMult>1.5){
    for(let i=last-6;i<=last-1;i++){
      if(i<1) continue;
      if(c[last]>o[last] && c[i]<o[i] && c[last]>h[i]) {obBull={high:h[i],low:l[i],i};break;}
      if(c[last]<o[last] && c[i]>o[i] && c[last]<l[i]) {obBear={high:h[i],low:l[i],i};break;}
    }
  }

  // Liquidity mapping: equal highs/lows clusters
  const clusterLevels=(sw,tol)=>{const out=[],used=new Array(sw.length).fill(false);
    for(let i=0;i<sw.length;i++){if(used[i])continue;const g=[sw[i]];used[i]=true;
      for(let j=i+1;j<sw.length;j++){if(used[j])continue;
        if(Math.abs(sw[j].p-sw[i].p)/sw[i].p<=tol){g.push(sw[j]);used[j]=true;}}
      if(g.length>=2) out.push({level:mean(g.map(x=>x.p)),count:g.length,lastIdx:Math.max(...g.map(x=>x.i))});}
    return out;};
  const hp=clusterLevels(sh,0.0015).filter(p=>p.lastIdx<last-2);
  const lp=clusterLevels(sl,0.0015).filter(p=>p.lastIdx<last-2);
  let sweepHigh=false,sweepLow=false,sweepLevel=null;
  for(let i=Math.max(0,last-2);i<=last;i++){
    for(const p of hp) if(h[i]>p.level && c[i]<p.level){sweepHigh=true;sweepLevel=p.level;}
    for(const p of lp) if(l[i]<p.level && c[i]>p.level){sweepLow=true;sweepLevel=p.level;}
  }

  const hi20=Math.max(...h.slice(-20)), lo20=Math.min(...l.slice(-20));
  const eq=(hi20+lo20)/2;
  return {bosBull,bosBear,chochBull,chochBear,fvgBull,fvgBear,obBull,obBear,
    sweepHigh,sweepLow,sweepLevel,inDiscount:c[last]<eq,inPremium:c[last]>eq,
    lastSH:lSH?lSH.p:null,lastSL:lSL?lSL.p:null,volMult,disp};
}

/* ================================================================
   MODULE 3: ORDER FLOW ENGINE
   Real taker buy/sell from aggTrade WebSocket or kline field 9
   ================================================================ */

function orderFlowMetrics(kl,last) {
  const v=kl.map(k=>+k[5]), tb=kl.map(k=>+k[9]), trades=kl.map(k=>+k[8]);
  const buy=[],sell=[],delta=[],ratio=[];
  for(let i=Math.max(0,last-19);i<=last;i++){
    const b=tb[i], s=v[i]-b;
    buy.push(b);sell.push(s);delta.push(b-s);
    ratio.push(v[i]>0?b/v[i]:0.5);
  }
  const curDelta=delta[delta.length-1];
  const dMean=mean(delta), dStd=Math.sqrt(delta.reduce((s,x)=>s+(x-dMean)**2,0)/delta.length)||1e-9;
  const deltaZ=(curDelta-dMean)/dStd;
  const cumDelta=delta.reduce((s,x)=>s+x,0);
  return {buy:buy[buy.length-1],sell:sell[sell.length-1],delta:curDelta,deltaZ,
    cumDelta,buyRatio:ratio[ratio.length-1],deltaSeries:delta};
}

function detectAbsorption(o,h,l,c,v,tb,last) {
  const body=Math.abs(c[last]-o[last]), range=h[last]-l[last];
  if(range<=0) return null;
  const volBase=sma(v,last-1,20), volMult=volBase>0?v[last]/volBase:0;
  const buyRatio=v[last]>0?tb[last]/v[last]:0.5;
  const cPos=(c[last]-l[last])/range;
  if(volMult>=2.0 && body/range<0.35 && cPos<0.4 && buyRatio>0.55) return "ABSORPTION_BULL";
  if(volMult>=2.0 && body/range<0.35 && cPos>0.6 && buyRatio<0.45) return "ABSORPTION_BEAR";
  return null;
}

function detectExhaustion(o,h,l,c,v,tb,last) {
  const volBase=sma(v,last-1,20), volMult=volBase>0?v[last]/volBase:0;
  const buyRatio=v[last]>0?tb[last]/v[last]:0.5;
  const upMove=(c[last]-c[last-2])/(c[last-2]||1);
  if(volMult>2.5 && upMove>0.02 && buyRatio<0.42) return "EXHAUSTION_BULL";
  if(volMult>2.5 && upMove<-0.02 && buyRatio>0.58) return "EXHAUSTION_BEAR";
  return null;
}

/* ================================================================
   MODULE 4: REGIME ENGINE
   ADX + ATR-percentile classification
   ================================================================ */

function regimeContext(h,l,c,last) {
  const tr=[]; for(let i=1;i<=last;i++) tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  const atr=tr.slice(-14).reduce((s,x)=>s+x,0)/14;
  const atrPct=atr/c[last]*100;
  const atrPercentile=tr.slice(-50).filter(x=>x<=atr).length/50*100;

  // Simplified ADX proxy via directional movement
  let plusDM=0,minusDM=0;
  for(let i=last-13;i<=last;i++){
    const up=h[i]-h[i-1], down=l[i-1]-l[i];
    if(up>down && up>0) plusDM+=up;
    if(down>up && down>0) minusDM+=down;
  }
  const diPlus=plusDM/(atr*14||1), diMinus=minusDM/(atr*14||1);
  const dx=Math.abs(diPlus-diMinus)/(diPlus+diMinus||1)*100;
  const adx=dx; // single-period proxy

  let regime="RANGING";
  if(adx>25 && atrPercentile>40) regime="TRENDING";
  else if(atrPercentile>75) regime="VOLATILE";
  return {regime,adx,atrPct,atrPercentile};
}

/* ================================================================
   MODULE 5: AI CORE — Ensemble + Triple-Barrier + Meta-Labeling
   ================================================================ */

class DecisionTree {
  constructor(maxDepth=5,minSamples=10){this.maxDepth=maxDepth;this.minSamples=minSamples;this.root=null;}
  fit(X,y){this.root=this._build(X,y,0);}
  _build(X,y,depth){
    const n=X.length, d=X[0].length, counts=[0,0];
    for(const l of y) counts[l]++;
    if(depth>=this.maxDepth||n<this.minSamples||counts[0]===0||counts[1]===0)
      return {leaf:true,prob:counts[1]/n};
    let bestGain=0,bestF=-1,bestT=0;
    const parentGini=1-(counts[0]/n)**2-(counts[1]/n)**2;
    for(let f=0;f<d;f++){
      const vals=X.map(r=>r[f]), uniq=[...new Set(vals)].sort((a,b)=>a-b);
      const step=Math.max(1,Math.floor(uniq.length/15));
      for(let i=step;i<uniq.length;i+=step){
        const th=uniq[i], L=[],R=[];
        for(let j=0;j<n;j++){if(X[j][f]<=th)L.push(j);else R.push(j);}
        if(L.length<this.minSamples||R.length<this.minSamples) continue;
        const lc=[0,0],rc=[0,0];
        for(const idx of L)lc[y[idx]]++; for(const idx of R)rc[y[idx]]++;
        const lg=1-(lc[0]/L.length)**2-(lc[1]/L.length)**2;
        const rg=1-(rc[0]/R.length)**2-(rc[1]/R.length)**2;
        const gain=parentGini-((L.length/n)*lg+(R.length/n)*rg);
        if(gain>bestGain){bestGain=gain;bestF=f;bestT=th;}
      }
    }
    if(bestGain===0) return {leaf:true,prob:counts[1]/n};
    const LX=[],LY=[],RX=[],RY=[];
    for(let i=0;i<n;i++){if(X[i][bestF]<=bestT){LX.push(X[i]);LY.push(y[i]);}else{RX.push(X[i]);RY.push(y[i]);}}
    return {leaf:false,feature:bestF,threshold:bestT,left:this._build(LX,LY,depth+1),right:this._build(RX,RY,depth+1)};
  }
  predict(x){
    let node=this.root; while(!node.leaf){if(x[node.feature]<=node.threshold)node=node.left;else node=node.right;}
    return node.prob;
  }
}

class RandomForest {
  constructor(n=15,depth=5,minS=8){this.n=n;this.depth=depth;this.minS=minS;this.trees=[];}
  fit(X,y){
    this.trees=[];
    for(let t=0;t<this.n;t++){
      const idx=[]; for(let i=0;i<X.length;i++) idx.push(Math.floor(Math.random()*X.length));
      const tree=new DecisionTree(this.depth,this.minS);
      tree.fit(idx.map(i=>X[i]),idx.map(i=>y[i]));
      this.trees.push(tree);
    }
  }
  predict(x){return this.trees.reduce((s,t)=>s+t.predict(x),0)/this.trees.length;}
}

class LogisticRegression {
  constructor(lr=0.08,epochs=150,l2=0.01){this.lr=lr;this.epochs=epochs;this.l2=l2;this.w=null;}
  fit(X,y){
    const n=X.length,d=X[0].length; this.w=new Array(d).fill(0);
    const sig=z=>1/(1+Math.exp(-Math.max(-15,Math.min(15,z))));
    for(let e=0;e<this.epochs;e++){
      for(let i=0;i<n;i++){
        let z=0; for(let j=0;j<d;j++) z+=this.w[j]*X[i][j];
        const p=sig(z), err=p-y[i];
        for(let j=0;j<d;j++) this.w[j]-=this.lr*(err*X[i][j]+this.l2*this.w[j]);
      }
    }
  }
  predict(x){
    let z=0; for(let j=0;j<x.length;j++) z+=this.w[j]*x[j];
    return 1/(1+Math.exp(-Math.max(-15,Math.min(15,z))));
  }
}

class EnsembleModel {
  constructor(){this.rf=new RandomForest(15,5,8);this.lr=new LogisticRegression(0.08,150,0.01);this.meta=null;}
  fit(X,y){
    this.rf.fit(X,y); this.lr.fit(X,y);
    const preds=X.map(x=>this.predictPrimary(x));
    const metaX=X.map((x,i)=>[1,preds[i],x[1],x[2],x[3]]);
    this.meta=new LogisticRegression(0.05,100,0.01);
    this.meta.fit(metaX,y);
  }
  predictPrimary(x){return this.rf.predict(x)*0.6 + this.lr.predict(x)*0.4;}
  predict(x){
    const p=this.predictPrimary(x);
    if(!this.meta) return p;
    return p * this.meta.predict([1,p,x[1],x[2],x[3]]);
  }
}

/* ================================================================
   TRIPLE-BARRIER LABELING
   ================================================================ */

function tripleBarrier(c,atr,i,profitMult=1.5,stopMult=1.0,maxHold=6){
  const entry=c[i], upper=entry+atr[i]*profitMult, lower=entry-atr[i]*stopMult;
  for(let j=i+1;j<=Math.min(i+maxHold,c.length-1);j++){
    if(c[j]>=upper) return 1;
    if(c[j]<=lower) return 0;
  }
  return 0;
}

/* ================================================================
   FEATURE EXTRACTION
   ================================================================ */

function extractFeatures(kl,last,atr,smc,of,regime){
  const A=atr[last]; if(!isFinite(A)||A<=0) return null;
  const o=+kl[last][1],h=+kl[last][2],l=+kl[last][3],c=+kl[last][4];
  const range=h-l, cPos=range>0?(c-l)/range:0.5;
  const bodyATR=Math.abs(c-o)/A;
  const ref20=+kl[Math.max(0,last-20)][4];
  return [
    1, smc.volMult, bodyATR, cPos, of.buyRatio, of.deltaZ,
    smc.fvgBull?1:0, smc.fvgBear?1:0, smc.bosBull?1:0, smc.bosBear?1:0,
    smc.chochBull?1:0, smc.chochBear?1:0, smc.obBull?1:0, smc.obBear?1:0,
    smc.sweepHigh?1:0, smc.sweepLow?1:0, smc.inDiscount?1:0, smc.inPremium?1:0,
    c>ref20?1:0, c<ref20?1:0,
    regime.adx/100, regime.atrPercentile/100
  ];
}

/* ================================================================
   MAIN ANALYZER
   ================================================================ */

function analyze(kl,tf,symbol){
  const n=kl.length; if(n<150) return null;
  const o=kl.map(k=>+k[1]),h=kl.map(k=>+k[2]),l=kl.map(k=>+k[3]),c=kl.map(k=>+k[4]);
  const v=kl.map(k=>+k[5]),tb=kl.map(k=>+k[9]),last=n-1;
  const tr=[]; for(let i=1;i<=last;i++) tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  const atr=[]; for(let i=0;i<tr.length;i++) atr.push(i<13?NaN:tr.slice(i-13,i+1).reduce((s,x)=>s+x,0)/14);
  atr.unshift(NaN);

  const swings=findSwings(h,l,2);
  const smc=smcContext(o,h,l,c,v,last,swings);
  const of=orderFlowMetrics(kl,last);
  const regime=regimeContext(h,l,c,last);
  const absorp=detectAbsorption(o,h,l,c,v,tb,last);
  const exhaust=detectExhaustion(o,h,l,c,v,tb,last);

  // AI training
  const X=[],y=[];
  for(let i=80;i<last-6;i++){
    const sw=findSwings(h.slice(0,i+1),l.slice(0,i+1),2);
    const sm=smcContext(o.slice(0,i+1),h.slice(0,i+1),l.slice(0,i+1),c.slice(0,i+1),v.slice(0,i+1),i,sw);
    const ofi=orderFlowMetrics(kl.slice(0,i+1),i);
    const reg=regimeContext(h.slice(0,i+1),l.slice(0,i+1),c.slice(0,i+1),i);
    const f=extractFeatures(kl.slice(0,i+1),i,atr.slice(0,i+1),sm,ofi,reg);
    if(!f) continue;
    X.push(f); y.push(tripleBarrier(c,atr,i));
  }

  let aiProb=0, aiAcc=0;
  if(X.length>=80 && y.reduce((s,x)=>s+x,0)>=10 && y.reduce((s,x)=>s+x,0)<y.length){
    const model=new EnsembleModel(); model.fit(X,y);
    let correct=0; for(let i=0;i<X.length;i++){if((model.predict(X[i])>0.5?1:0)===y[i])correct++;}
    aiAcc=correct/X.length;
    const f=extractFeatures(kl,last,atr,smc,of,regime);
    if(f) aiProb=Math.round(model.predict(f)*100);
    STATE.aiModels[symbol]={prob:aiProb,acc:Math.round(aiAcc*100),trainSize:X.length};
  }

  // SCORING
  let score=0; const tags=[];
  const add=(cond,pts,label,cls)=>{if(cond){score+=pts;tags.push([label,1,cls||"on"]);}else tags.push([label,0,""]);};
  add(smc.volMult>=1.5,10,`VOL ${smc.volMult.toFixed(1)}x`);
  add(Math.abs(of.buyRatio-0.5)>=0.12,12,`BR ${(of.buyRatio*100).toFixed(0)}%`,"blue");
  add(Math.abs(of.deltaZ)>=1.5,12,`ΔZ ${of.deltaZ.toFixed(1)}`,"blue");
  add(smc.bosBull||smc.bosBear,10,smc.bosBull?"BOS↑":"BOS↓");
  add(smc.chochBull||smc.chochBear,12,smc.chochBull?"CHoCH↑":"CHoCH↓","warn");
  add(smc.obBull||smc.obBear,10,smc.obBull?"OB↑":"OB↓","warn");
  add(smc.fvgBull||smc.fvgBear,6,smc.fvgBull?"FVG↑":"FVG↓");
  add(smc.sweepHigh||smc.sweepLow,14,smc.sweepLow?"SWEEP↓":"SWEEP↑","warn");
  add(smc.inDiscount||smc.inPremium,5,smc.inDiscount?"DISC":"PREM");
  add(absorp!==null,8,absorp||"ABS","cyan");
  add(exhaust!==null,7,exhaust||"EXH","danger");
  add(regime.regime==="TRENDING",5,"TREND","on");
  add(regime.regime==="VOLATILE",3,"VOLATILE","warn");

  const base={symbol,tf,price:c[last],smc,of,regime,absorp,exhaust,score,aiProb,aiAcc,tags,sig:null};
  if(score<CFG.minScore||aiProb<CFG.minProb) return base;

  // DIRECTION
  let bull=0,bear=0;
  if(of.buyRatio>0.5) bull+=Math.round((of.buyRatio-0.5)*30); else bear+=Math.round((0.5-of.buyRatio)*30);
  if(of.delta>0) bull+=2; else bear+=2;
  if(smc.bosBull) bull+=3; if(smc.bosBear) bear+=3;
  if(smc.chochBull) bull+=3; if(smc.chochBear) bear+=3;
  if(smc.obBull) bull+=2; if(smc.obBear) bear+=2;
  if(smc.sweepLow) bull+=2; if(smc.sweepHigh) bear+=2;
  if(smc.fvgBull) bull+=1; if(smc.fvgBear) bear+=1;
  if(absorp==="ABSORPTION_BULL") bull+=2; if(absorp==="ABSORPTION_BEAR") bear+=2;
  if(exhaust==="EXHAUSTION_BULL") bear+=2; if(exhaust==="EXHAUSTION_BEAR") bull+=2;

  if(bull===bear) return base;
  const dir=bull>bear?"BULLISH":"BEARISH";

  // Veto: order flow must agree
  if(dir==="BULLISH" && of.buyRatio<0.42) return base;
  if(dir==="BEARISH" && of.buyRatio>0.58) return base;

  const A=atr[last], entry=c[last];
  let stop = dir==="BULLISH" ? l[last]-A*0.5 : h[last]+A*0.5;
  if(dir==="BULLISH"&&smc.sweepLow&&smc.sweepLevel) stop=Math.min(stop,smc.sweepLevel-A*0.25);
  if(dir==="BEARISH"&&smc.sweepHigh&&smc.sweepLevel) stop=Math.max(stop,smc.sweepLevel+A*0.25);
  const risk=Math.abs(entry-stop);
  const tp1=dir==="BULLISH"?entry+risk*1.5:entry-risk*1.5;
  const tp2=dir==="BULLISH"?entry+risk*2.5:entry-risk*2.5;

  base.sig={symbol,tf,dir,score:Math.round(score),aiProb,entry,stop,tp1,tp2,
    rr:risk>0?Math.abs(tp2-entry)/risk:0,tags,
    note:tags.filter(t=>t[1]).map(t=>t[0]).join(" · ")};
  return base;
}

/* ================================================================
   SCANNER
   ================================================================ */

async function scan(){
  if(STATE.scanning) return; STATE.scanning=true; const t0=Date.now();
  try{
    if(!STATE.universe.length) await loadUniverse();
    const jobs=[];
    for(const u of STATE.universe) for(const tf of CFG.scanTfs) jobs.push({symbol:u.symbol,tf});
    $("status").textContent=`scanning 0/${jobs.length}`;
    let done=0;
    const results=await Promise.all(jobs.map(async j=>{
      try{
        const kl=await getJSON(`${CFG.baseRest}/api/v3/klines?symbol=${j.symbol}&interval=${j.tf}&limit=${CFG.klinesLimit}`,45000);
        done++; if(done%10===0) $("status").textContent=`scanning ${done}/${jobs.length}`;
        return analyze(kl,j.tf,j.symbol);
      }catch(e){return null;}
    }));

    const best={},signals=[];
    for(const r of results){
      if(!r) continue;
      if(!best[r.symbol]||r.score>best[r.symbol].score) best[r.symbol]=r;
      if(r.sig){const cur=signals.find(s=>s.symbol===r.symbol);if(!cur||r.sig.score>cur.score){if(cur)signals.splice(signals.indexOf(cur),1);signals.push(r.sig);}}
    }
    STATE.results=best; STATE.signals=signals.sort((a,b)=>(b.aiProb+b.score)-(a.aiProb+a.score));
    STATE.lastScan=Date.now();
    renderSignals(); renderResearch(); renderAI();
    const dur=((Date.now()-t0)/1000).toFixed(1);
    $("status").textContent=`${STATE.signals.length} signals · ${Object.keys(best).length} pairs · ${dur}s`;
    $("status").className="ok";
    log(`scan complete: ${STATE.signals.length} signals in ${dur}s`,"ok");
  }catch(e){$("status").className="err";$("status").textContent="scan failed";log(e.message,"fail");}
  finally{STATE.scanning=false;}
}

/* ================================================================
   RENDERERS
   ================================================================ */

function renderSignals(){
  const st=$("signalStats"); const total=Object.keys(STATE.results).length;
  const sigs=STATE.signals.length; const longs=STATE.signals.filter(s=>s.dir==="BULLISH").length;
  const shorts=STATE.signals.filter(s=>s.dir==="BEARISH").length;
  st.innerHTML=`<div class="stat"><div class="k">PAIRS</div><div class="v">${total}</div></div>
    <div class="stat"><div class="k">SIGNALS</div><div class="v" style="color:var(--green)">${sigs}</div></div>
    <div class="stat"><div class="k">LONG/SHORT</div><div class="v"><span style="color:var(--green)">${longs}</span>/<span style="color:var(--red)">${shorts}</span></div></div>`;
  const f=STATE.sigFilter; let list=STATE.signals;
  if(f==="BULLISH"||f==="BEARISH") list=list.filter(s=>s.dir===f);
  const el=$("feed");
  if(!list.length){el.innerHTML='<div class="empty">No setups above threshold.<br>Check Research for live metrics.</div>';return;}
  el.innerHTML=list.map(s=>{
    const cls=s.dir==="BULLISH"?"bullish":"bearish";
    const sc=s.aiProb>=70?"high":"mid";
    const tags=s.tags.map(t=>`<span class="tag ${t[1]?(t[2]||"on"):"off"}">${t[0]}</span>`).join("");
    return `<div class="card ${cls}" data-sym="${s.symbol}">
      <div class="card-top"><div><span class="symbol">${s.symbol.replace("USDT","")}</span><span class="tf">${s.tf}</span></div>
      <span class="score ${sc}">${s.aiProb}% ${s.dir==="BULLISH"?"▲":"▼"}</span></div>
      <div class="tagrow">${tags}</div>
      <div class="levels">
        <div class="lb"><span class="ll">ENTRY</span><span class="lv">${fmt(s.entry)}</span></div>
        <div class="lb"><span class="ll">STOP</span><span class="lv" style="color:var(--red)">${fmt(s.stop)}</span></div>
        <div class="lb"><span class="ll">TP1</span><span class="lv" style="color:var(--green)">${fmt(s.tp1)}</span></div>
        <div class="lb"><span class="ll">TP2</span><span class="lv" style="color:var(--green)">${fmt(s.tp2)}</span></div>
      </div>
      <div class="note">SCORE ${s.score} · R:R ${s.rr.toFixed(1)} · ${s.note}</div>
    </div>`;
  }).join("");
  el.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openChart(c.dataset.sym)));
}

function renderResearch(){
  const sort=$("sortSel").value, rows=Object.values(STATE.results);
  if(!rows.length){$("researchList").innerHTML='<div class="empty">No data.</div>';return;}
  const key={prob:r=>r.aiProb,score:r=>r.score,cvd:r=>Math.abs(r.of.cumDelta),obi:r=>Math.abs(r.of.buyRatio-0.5)}[sort];
  rows.sort((a,b)=>key(b)-key(a));
  $("researchList").innerHTML=rows.map(r=>{
    const br=r.of.buyRatio>=0.55?"on":r.of.buyRatio<=0.45?"bear":"";
    const ai=r.aiProb>=70?"on":r.aiProb>=55?"warn":"";
    return `<div class="rrow" data-sym="${r.symbol}">
      <div><div><span class="rsym">${r.symbol.replace("USDT","")}</span><span class="rtf">${r.tf}</span></div>
      <div class="rprice">${fmt(r.price)}</div><div class="rsub">${r.regime.regime} · ADX ${r.regime.adx.toFixed(0)}</div></div>
      <div class="rmetrics">
        <span class="pill ${ai}">AI ${r.aiProb}%</span>
        <span class="pill ${r.score>=CFG.minScore?"on":""}">S${r.score}</span>
        <span class="pill ${br}">BR ${(r.of.buyRatio*100).toFixed(0)}%</span>
        <span class="pill ${Math.abs(r.of.deltaZ)>=1.5?"blue":""}">ΔZ ${r.of.deltaZ.toFixed(1)}</span>
        <span class="pill">${r.regime.regime}</span>
      </div></div>`;
  }).join("");
  $("researchList").querySelectorAll(".rrow").forEach(r=>r.addEventListener("click",()=>openChart(r.dataset.sym)));
}

function renderAI(){
  const rows=Object.values(STATE.aiModels);
  if(!rows.length){$("aiPanel").innerHTML='<div class="empty">Models training…</div>';return;}
  const avg=rows.reduce((s,r)=>s+r.acc,0)/rows.length;
  $("aiPanel").innerHTML=`<div class="stats" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat"><div class="k">MODELS</div><div class="v">${rows.length}</div></div>
    <div class="stat"><div class="k">AVG ACC</div><div class="v" style="color:var(--cyan)">${avg.toFixed(0)}%</div></div>
    <div class="stat"><div class="k">BEST</div><div class="v" style="color:var(--green)">${Math.max(...rows.map(r=>r.acc))}%</div></div>
  </div>` + rows.sort((a,b)=>b.prob-a.prob).slice(0,15).map(r=>{
    return `<div class="rrow"><div><span class="rsym">${r.symbol||"model"}</span></div>
    <div class="rmetrics"><span class="pill ${r.prob>=70?"on":""}">P ${r.prob}%</span>
    <span class="pill">ACC ${r.acc}%</span><span class="pill">N ${r.trainSize}</span></div></div>`;
  }).join("");
}

/* ================================================================
   CHART & TABS & BOOT
   ================================================================ */

function fillChartSelect(){const s=$("chartSym");s.innerHTML=STATE.universe.map(u=>`<option value="${u.symbol}">${u.base}</option>`).join("");if(STATE.universe.length){STATE.chartSym=STATE.universe[0].symbol;s.value=STATE.chartSym;}}
function fillResearchSelect(){const s=$("researchSym");s.innerHTML=STATE.universe.map(u=>`<option value="${u.symbol}">${u.base}</option>`).join("");}

function initChart(){
  const c=$("chartContainer"); if(!c||STATE.chart)return;
  STATE.chart=LightweightCharts.createChart(c,{layout:{background:{color:"#12171f"},textColor:"#7a8698"},
    grid:{vertLines:{color:"#1a2130"},horzLines:{color:"#1a2130"}},rightPriceScale:{borderColor:"#1f2733"},
    timeScale:{borderColor:"#1f2733",timeVisible:true}});
  STATE.candleSeries=STATE.chart.addCandlestickSeries({upColor:"#0ecb81",downColor:"#f6465d",borderVisible:false,
    wickUpColor:"#0ecb81",wickDownColor:"#f6465d"});
  new ResizeObserver(()=>{if(STATE.chart)STATE.chart.applyOptions({width:c.clientWidth,height:c.clientHeight});}).observe(c);
}

async function loadChart(){
  if(!STATE.chartSym)return;
  try{
    initChart();
    const kl=await getJSON(`${CFG.baseRest}/api/v3/klines?symbol=${STATE.chartSym}&interval=${STATE.chartTf}&limit=300`,20000);
    STATE.candleSeries.setData(kl.map(k=>({time:Math.floor(+k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]})));
    STATE.chart.timeScale().fitContent();
    const last=+kl[kl.length-1][4],prev=+kl[kl.length-2][4],ch=(last/prev-1)*100;
    $("chartLegend").innerHTML=`<b>${STATE.chartSym}</b> · ${STATE.chartTf} · ${fmt(last)} <span style="color:${ch>=0?"var(--green)":"var(--red)"}">${ch>=0?"+":""}${ch.toFixed(2)}%</span>`;
  }catch(e){$("chartLegend").textContent="failed";}
}

function openChart(sym){STATE.chartSym=sym;if($("chartSym"))$("chartSym").value=sym;switchTab("chart");setTimeout(loadChart,50);}

function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.id==="tab-"+name));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));
  if(name==="chart")setTimeout(()=>{initChart();loadChart();},50);
  if(name==="research")renderResearch(); if(name==="ai")renderAI();
}

document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
  $("sigSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;STATE.sigFilter=b.dataset.f;
    Array.from($("sigSeg").children).forEach(x=>x.classList.toggle("on",x===b));renderSignals();});
  $("sortSel").addEventListener("change",renderResearch);
  $("chartSym").addEventListener("change",e=>{STATE.chartSym=e.target.value;loadChart();});
  $("chartTfs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;STATE.chartTf=b.dataset.tf;
    Array.from($("chartTfs").children).forEach(x=>x.classList.toggle("on",x===b));loadChart();});
  $("btnRefresh").addEventListener("click",()=>{STATE.universe=[];STATE.results={};STATE.aiModels={};scan();});
  $("btnTest").addEventListener("click",async()=>{
    $("debug").innerHTML=""; log("testing endpoints…","info");
    try{const r=await fetch(`${CFG.baseRest}/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=3`);log(`klines: ${r.ok?"OK":"FAIL"}`,r.ok?"ok":"fail");}catch(e){log(`klines: ${e.message}`,"fail");}
  });
  (async()=>{try{await loadUniverse();initChart();await scan();}catch(e){$("status").className="err";$("status").textContent=e.message;}})();
});
</script>
