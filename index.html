<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Intelligence</title>
<style>
:root{--bg:#080a0f;--card:#12171f;--card2:#171d27;--line:#1f2733;--green:#0ecb81;--red:#f6465d;--amber:#f0b90b;--blue:#3b82f6;--cyan:#06b6d4;--purple:#a855f7;--text:#e8ecf1;--muted:#7a8698;--dim:#4b5563}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;font-size:13px;line-height:1.5}
h1{font-size:14px;letter-spacing:2px;font-weight:800;margin-bottom:10px}
h1 span{color:var(--cyan)}
h2{font-size:11px;color:var(--cyan);margin:16px 0 8px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.sel{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;font-size:13px;font-weight:600;margin-bottom:8px}
.btn{width:100%;padding:12px;border-radius:8px;border:none;background:var(--green);color:#021a10;font-weight:800;font-size:13px;cursor:pointer;margin-bottom:6px}
.btn-alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.auto{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.row:last-child{border-bottom:none}
.lbl{color:var(--muted)}.val{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.pass{color:var(--green)}.fail{color:var(--red)}.warn{color:var(--amber)}.info{color:var(--muted)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.stat .v{font-size:14px;font-weight:800;font-family:ui-monospace,Menlo,monospace}
.book{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}

.tag.on{background:rgba(14,203,129,.14);color:var(--green)}

<body>

<h1>MARKET<span>·INTELLIGENCE</span></h1>

<select class="sel" id="sym">
  <option value="BTCUSDT">BTC/USDT</option>
  <option value="ETHUSDT">ETH/USDT</option>
  <option value="SOLUSDT">SOL/USDT</option>
  <option value="XRPUSDT">XRP/USDT</option>
  <option value="ADAUSDT">ADA/USDT</option>
  <option value="DOGEUSDT">DOGE/USDT</option>
</select>

<button class="btn" id="btnRefresh" onclick="refresh()">Refresh All Data</button>
<div class="auto" id="auto">idle</div>

<div id="output"></div>

<h2>DATA LOG</h2>
<div id="log">ready</div>

<script>
'use strict';

const BASE = 'https://data-api.binance.vision';
const STATE = { symbol: 'BTCUSDT', depthHistory: [], lastRefresh: 0 };

function log(msg, cls) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if (cls) d.style.color = cls === 'ok' ? 'var(--green)' : cls === 'err' ? 'var(--red)' : 'var(--amber)';
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 50) el.removeChild(el.firstChild);
}

function fmt(n, dec) {
  if (!isFinite(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return n.toLocaleString(undefined, {maximumFractionDigits: dec || 1});
  if (a >= 1) return n.toFixed(dec || 3);
  if (a >= 0.01) return n.toFixed(4);
  return n.toPrecision(4);
}

/* ============================================================
   DATA FETCHERS — REAL ENDPOINTS
   ============================================================ */
async function fetchKlines(symbol, interval, limit) {
  const r = await fetch(`${BASE}/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
  if (!r.ok) throw new Error('klines ' + r.status);
  const raw = await r.json();
  return raw.map(k => ({
    t: +k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4],
    v: +k[5], tb: +k[9], trades: +k[8]
  }));
}

async function fetchDepth(symbol, limit) {
  const r = await fetch(`${BASE}/api/v3/depth?symbol=${symbol}&limit=${limit}`);
  if (!r.ok) throw new Error('depth ' + r.status);
  const d = await r.json();
  return {
    bids: d.bids.map(b => ({ p: +b[0], q: +b[1] })),
    asks: d.asks.map(a => ({ p: +a[0], q: +a[1] }))
  };
}

async function fetchAggTrades(symbol, limit) {
  const r = await fetch(`${BASE}/api/v3/aggTrades?symbol=${symbol}&limit=${limit}`);
  if (!r.ok) throw new Error('aggTrades ' + r.status);
  const d = await r.json();
  return d.map(t => ({
    p: +t.p, q: +t.q, time: t.T, isBuyerMaker: t.m, isBestMatch: t.M
  }));
}

async function fetch24h(symbol) {
  const r = await fetch(`${BASE}/api/v3/ticker/24hr?symbol=${symbol}`);
  if (!r.ok) throw new Error('ticker ' + r.status);
  const d = await r.json();
  return {
    price: +d.lastPrice, change: +d.priceChangePercent,
    high: +d.highPrice, low: +d.lowPrice, vol: +d.quoteVolume
  };
}

/* ============================================================
   ORDER BOOK ENGINE
   ============================================================ */
function analyzeOrderBook(depth) {
  const bids = depth.bids, asks = depth.asks;
  const mid = (bids[0].p + asks[0].p) / 2;
  const spread = asks[0].p - bids[0].p;
  const spreadPct = (spread / mid) * 100;

  // Imbalance at multiple depths
  function calcImbalance(bids, asks, level) {
    let bv = 0, av = 0;
    for (let i = 0; i < Math.min(level, bids.length); i++) bv += bids[i].q;
    for (let i = 0; i < Math.min(level, asks.length); i++) av += asks[i].q;
    const total = bv + av;
    return total > 0 ? (bv - av) / total : 0;
  }

  const imb5 = calcImbalance(bids, asks, 5);
  const imb20 = calcImbalance(bids, asks, 20);
  const imb50 = calcImbalance(bids, asks, 50);

  // Total volume
  let totalBidVol = 0, totalAskVol = 0;
  for (const b of bids) totalBidVol += b.q;
  for (const a of asks) totalAskVol += a.q;

  // Largest walls
  function findWalls(orders, mid, side) {
    const sorted = [...orders].sort((a, b) => b.q - a.q).slice(0, 3);
    return sorted.map(o => ({
      price: o.p,
      qty: o.q,
      distance: Math.abs(o.p - mid) / mid * 100,
      side
    }));
  }

  const bidWalls = findWalls(bids, mid, 'bid');
  const askWalls = findWalls(asks, mid, 'ask');

  return {
    mid, spread, spreadPct, imb5, imb20, imb50,
    totalBidVol, totalAskVol,
    bidWalls, askWalls,
    topBids: bids.slice(0, 10),
    topAsks: asks.slice(0, 10)
  };
}

function trackDepthHistory(symbol, depth) {
  const now = Date.now();
  const snapshot = {
    time: now,
    bids: depth.bids.slice(0, 20).map(b => ({ p: b.p, q: b.q })),
    asks: depth.asks.slice(0, 20).map(a => ({ p: a.p, q: a.q }))
  };
  STATE.depthHistory.push(snapshot);
  // Keep last 30 snapshots (~5 minutes at 10s intervals)
  while (STATE.depthHistory.length > 30) STATE.depthHistory.shift();
}

/* ============================================================
   MANIPULATION ENGINE
   Detects spoofing from depth history + stop hunts from klines
   ============================================================ */
function detectSpoofing(depthHistory) {
  if (depthHistory.length < 2) return { detected: false, reason: 'need more snapshots' };

  const prev = depthHistory[depthHistory.length - 2];
  const curr = depthHistory[depthHistory.length - 1];

  // Find large orders in prev that disappeared in curr
  function avgQty(orders) {
    return orders.reduce((s, o) => s + o.q, 0) / orders.length || 1;
  }

  const avgBid = avgQty(prev.bids);
  const avgAsk = avgQty(prev.asks);
  const largeBidThreshold = avgBid * 3;
  const largeAskThreshold = avgAsk * 3;

  const vanished = [];
  for (const prevOrder of prev.bids) {
    if (prevOrder.q < largeBidThreshold) continue;
    const stillThere = curr.bids.find(o => Math.abs(o.p - prevOrder.p) < 0.001 && o.q >= prevOrder.q * 0.5);
    if (!stillThere) {
      vanished.push({ side: 'bid', price: prevOrder.p, qty: prevOrder.q, size: 'large' });
    }
  }
  for (const prevOrder of prev.asks) {
    if (prevOrder.q < largeAskThreshold) continue;
    const stillThere = curr.asks.find(o => Math.abs(o.p - prevOrder.p) < 0.001 && o.q >= prevOrder.q * 0.5);
    if (!stillThere) {
      vanished.push({ side: 'ask', price: prevOrder.p, qty: prevOrder.q, size: 'large' });
    }
  }

  return {
    detected: vanished.length >= 1,
    count: vanished.length,
    vanished,
    reason: vanished.length >= 1
      ? `${vanished.length} large order(s) disappeared within ${((curr.time - prev.time)/1000).toFixed(0)}s`
      : 'no vanishing large orders'
  };
}

function detectStopHunts(klines) {
  // Wick beyond prior swing high/low with close back inside
  const n = klines.length;
  const hunts = [];

  for (let i = 5; i < n; i++) {
    const bar = klines[i];
    const body = Math.abs(bar.c - bar.o);
    const range = bar.h - bar.l;
    if (range === 0) continue;

    // Prior swing high/low (5-bar)
    let priorHigh = -Infinity, priorLow = Infinity;
    for (let j = i - 5; j < i; j++) {
      if (klines[j].h > priorHigh) priorHigh = klines[j].h;
      if (klines[j].l < priorLow) priorLow = klines[j].l;
    }

    const wickUp = bar.h - Math.max(bar.o, bar.c);
    const wickDown = Math.min(bar.o, bar.c) - bar.l;

    if (bar.h > priorHigh && bar.c < priorHigh && wickUp > body * 1.2) {
      hunts.push({ type: 'STOP_HUNT_UP', index: i, level: priorHigh, wick: wickUp });
    }
    if (bar.l < priorLow && bar.c > priorLow && wickDown > body * 1.2) {
      hunts.push({ type: 'STOP_HUNT_DOWN', index: i, level: priorLow, wick: wickDown });
    }
  }

  return hunts.slice(-5);
}

/* ============================================================
   ORDER FLOW ENGINE
   Real buy/sell from aggTrades
   ============================================================ */
function analyzeOrderFlow(trades) {
  let buyVol = 0, sellVol = 0, buyCount = 0, sellCount = 0;
  let largestBuy = 0, largestSell = 0;
  const largeTrades = [];

  for (const t of trades) {
    const notional = t.p * t.q;
    if (t.isBuyerMaker) {
      sellVol += notional; sellCount++;
      if (notional > largestSell) largestSell = notional;
    } else {
      buyVol += notional; buyCount++;
      if (notional > largestBuy) largestBuy = notional;
    }
    // Large trades (> $50k notional)
    if (notional > 50000) {
      largeTrades.push({
        side: t.isBuyerMaker ? 'SELL' : 'BUY',
        price: t.p, qty: t.q, notional: notional, time: t.time
      });
    }
  }

  const totalVol = buyVol + sellVol;
  const delta = buyVol - sellVol;
  const buyRatio = totalVol > 0 ? buyVol / totalVol : 0.5;

  // Cumulative delta from first to last
  let cvd = 0;
  const cvdSeries = [];
  for (const t of trades) {
    const notional = t.p * t.q;
    cvd += t.isBuyerMaker ? -notional : notional;
    cvdSeries.push(cvd);
  }

  // Delta trend (last 20% vs first 20%)
  const split = Math.floor(trades.length * 0.2);
  const earlyDelta = split > 0 ? cvdSeries[split - 1] : 0;
  const lateDelta = cvdSeries[cvdSeries.length - 1] || 0;
  const deltaTrend = lateDelta - earlyDelta;

  return {
    buyVol, sellVol, buyCount, sellCount,
    delta, buyRatio, cvd, deltaTrend,
    largestBuy, largestSell, largeTrades,
    totalTrades: trades.length
  };
}

/* ============================================================
   VOLUME ENGINE
   Volume profile from klines + comparison to baseline
   ============================================================ */
function analyzeVolume(klines, currentPrice) {
  const recent = klines.slice(-100);
  const last = klines[klines.length - 1];
  const last20 = klines.slice(-20);
  const avgVol = last20.reduce((s, k) => s + k.v, 0) / last20.length;
  const volMultiple = avgVol > 0 ? last.v / avgVol : 0;

  // Volume profile (last 100 bars)
  // Bucket by price range
  const high = Math.max(...recent.map(k => k.h));
  const low = Math.min(...recent.map(k => k.l));
  const buckets = 30;
  const bucketSize = (high - low) / buckets;
  const volumeAtPrice = new Array(buckets).fill(0);

  for (const k of recent) {
    const midPrice = (k.h + k.l) / 2;
    const idx = Math.min(buckets - 1, Math.floor((midPrice - low) / bucketSize));
    volumeAtPrice[idx] += k.v;
  }

  // POC = Point of Control (highest volume bucket)
  let pocIdx = 0, pocVol = 0;
  for (let i = 0; i < volumeAtPrice.length; i++) {
    if (volumeAtPrice[i] > pocVol) { pocVol = volumeAtPrice[i]; pocIdx = i; }
  }
  const poc = low + (pocIdx + 0.5) * bucketSize;

  // Value Area (70% of total volume)
  const totalVol = volumeAtPrice.reduce((s, v) => s + v, 0);
  const target = totalVol * 0.7;
  let acc = volumeAtPrice[pocIdx];
  let upIdx = pocIdx, downIdx = pocIdx;
  while (acc < target) {
    const upVol = upIdx + 1 < volumeAtPrice.length ? volumeAtPrice[upIdx + 1] : 0;
    const downVol = downIdx - 1 >= 0 ? volumeAtPrice[downIdx - 1] : 0;
    if (upVol > downVol && upIdx + 1 < volumeAtPrice.length) {
      upIdx++; acc += upVol;
    } else if (downIdx - 1 >= 0) {
      downIdx--; acc += downVol;
    } else {
      break;
    }
  }
  const vah = low + (upIdx + 1) * bucketSize;
  const val = low + downIdx * bucketSize;

  // Delta from klines
  const lastDelta = 2 * last.tb - last.v;
  const lastBuyRatio = last.v > 0 ? last.tb / last.v : 0.5;

  // Absorption: high volume, small body, wrong-direction close
  const body = Math.abs(last.c - last.o);
  const range = last.h - last.l;
  const bodyRatio = range > 0 ? body / range : 0;
  const cPos = range > 0 ? (last.c - last.l) / range : 0.5;
  const absorption = volMultiple >= 2.0 && bodyRatio < 0.35
    ? (cPos < 0.4 && lastBuyRatio > 0.55 ? 'BULLISH_ABSORPTION'
       : cPos > 0.6 && lastBuyRatio < 0.45 ? 'BEARISH_ABSORPTION' : null)
    : null;

  return {
    volMultiple, avgVol,
    poc, vah, val,
    currentPrice, inValueArea: currentPrice >= val && currentPrice <= vah,
    abovePOC: currentPrice > poc,
    lastDelta, lastBuyRatio,
    absorption,
    volumeAtPrice
  };
}

/* ============================================================
   STRUCTURE ENGINE (SMC/ICT)
   ============================================================ */
function analyzeStructure(klines) {
  const n = klines.length;

  // Swing detection
  function findSwings(klines, lookback) {
    const highs = [], lows = [];
    for (let i = lookback; i < klines.length - lookback; i++) {
      let isH = true, isL = true;
      for (let j = 1; j <= lookback; j++) {
        if (klines[i].h <= klines[i-j].h || klines[i].h <= klines[i+j].h) isH = false;
        if (klines[i].l >= klines[i-j].l || klines[i].l >= klines[i+j].l) isL = false;
      }
      if (isH) highs.push({ i, price: klines[i].h });
      if (isL) lows.push({ i, price: klines[i].l });
    }
    return { highs, lows };
  }

  const swings = findSwings(klines, 2);
  const lastHighs = swings.highs.slice(-5);
  const lastLows = swings.lows.slice(-5);
  const lastBar = klines[n - 1];
  const prevBar = klines[n - 2];

  // BOS
  let bosBull = false, bosBear = false;
  if (lastHighs.length > 0) {
    const lastHigh = lastHighs[lastHighs.length - 1];
    if (lastBar.c > lastHigh.price && prevBar.c <= lastHigh.price) bosBull = true;
  }
  if (lastLows.length > 0) {
    const lastLow = lastLows[lastLows.length - 1];
    if (lastBar.c < lastLow.price && prevBar.c >= lastLow.price) bosBear = true;
  }

  // CHoCH (reversal of character)
  let chochBull = false, chochBear = false;
  if (bosBull && lastHighs.length >= 2) {
    const prevHigh = lastHighs[lastHighs.length - 2];
    if (prevHigh.price < lastHighs[lastHighs.length - 1].price) chochBull = true;
  }
  if (bosBear && lastLows.length >= 2) {
    const prevLow = lastLows[lastLows.length - 2];
    if (prevLow.price > lastLows[lastLows.length - 1].price) chochBear = true;
  }

  // FVG (Fair Value Gap)
  let fvgBull = null, fvgBear = null;
  for (let i = n - 5; i < n; i++) {
    if (klines[i].l > klines[i-2].h) {
      fvgBull = { top: klines[i].l, bottom: klines[i-2].h, age: n - 1 - i };
    }
    if (klines[i].h < klines[i-2].l) {
      fvgBear = { top: klines[i-2].l, bottom: klines[i].h, age: n - 1 - i };
    }
  }

  // Premium / Discount
  const recentHigh = Math.max(...klines.slice(-20).map(k => k.h));
  const recentLow = Math.min(...klines.slice(-20).map(k => k.l));
  const equilibrium = (recentHigh + recentLow) / 2;
  const inPremium = lastBar.c > equilibrium;
  const inDiscount = lastBar.c < equilibrium;

  // Liquidity sweep
  let sweepHigh = false, sweepLow = false, sweepLevel = null;
  if (lastHighs.length > 0) {
    for (const h of lastHighs) {
      if (lastBar.h > h.price && lastBar.c < h.price) {
        sweepHigh = true; sweepLevel = h.price;
      }
    }
  }
  if (lastLows.length > 0) {
    for (const l of lastLows) {
      if (lastBar.l < l.price && lastBar.c > l.price) {
        sweepLow = true; sweepLevel = l.price;
      }
    }
  }

  return {
    bosBull, bosBear, chochBull, chochBear,
    fvgBull, fvgBear,
    inPremium, inDiscount, equilibrium,
    sweepHigh, sweepLow, sweepLevel,
    recentHigh, recentLow
  };
}

/* ============================================================
   RENDER
   ============================================================ */
async function refresh() {
  const sym = document.getElementById('sym').value;
  STATE.symbol = sym;
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  document.getElementById('auto').textContent = 'fetching all data…';

  try {
    log('Fetching ' + sym + '…', 'ok');

    // Fetch everything in parallel
    const [klines1h, klines15m, depth, trades, ticker] = await Promise.all([
      fetchKlines(sym, '1h', 200),
      fetchKlines(sym, '15m', 100),
      fetchDepth(sym, 100),
      fetchAggTrades(sym, 1000),
      fetch24h(sym)
    ]);

    log('klines: ' + klines1h.length + ' 1h bars, ' + klines15m.length + ' 15m bars', 'ok');
    log('depth: ' + depth.bids.length + ' bids, ' + depth.asks.length + ' asks', 'ok');
    log('trades: ' + trades.length + ' aggTrades', 'ok');

    // Track depth for manipulation detection
    trackDepthHistory(sym, depth);

    // Run engines
    const ob = analyzeOrderBook(depth);
    const of = analyzeOrderFlow(trades);
    const vol = analyzeVolume(klines1h, ticker.price);
    const struct = analyzeStructure(klines1h);
    const spoof = detectSpoofing(STATE.depthHistory);
    const hunts = detectStopHunts(klines1h);

    render(ticker, ob, of, vol, struct, spoof, hunts);
    log('Analysis complete', 'ok');
    document.getElementById('auto').textContent = 'last refresh: ' + new Date().toLocaleTimeString();
  } catch (e) {
    log('ERROR: ' + e.message, 'err');
    document.getElementById('output').innerHTML = `<div class="card"><div style="color:var(--red)">Error: ${e.message}</div></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh All Data';
  }
}

function render(ticker, ob, of, vol, struct, spoof, hunts) {
  const out = document.getElementById('output');
  const priceUp = ticker.change >= 0;

  let html = '';

  // ---- PRICE CARD ----
  html += '<div class="card">';
  html += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">`;
  html += `<div style="font-size:20px;font-weight:800">${STATE.symbol.replace('USDT','')}/USDT</div>`;
  html += `<div style="font-size:16px;font-weight:800;color:${priceUp?'var(--green)':'var(--red)'}">${fmt(ticker.price)} ${priceUp?'+':''}${ticker.change.toFixed(2)}%</div>`;
  html += `</div>`;
  html += '<div class="grid3">';
  html += `<div class="stat"><div class="k">24H HIGH</div><div class="v">${fmt(ticker.high)}</div></div>`;
  html += `<div class="stat"><div class="k">24H LOW</div><div class="v">${fmt(ticker.low)}</div></div>`;
  html += `<div class="stat"><div class="k">24H VOL</div><div class="v">${fmt(ticker.vol)}</div></div>`;
  html += '</div></div>';

  // ---- ORDER BOOK CARD ----
  html += '<div class="card">';
  html += '<h2 style="margin-top:0">Order Book — LIVE</h2>';
  html += '<div class="grid3">';
  html += `<div class="stat"><div class="k">SPREAD</div><div class="v">${ob.spreadPct.toFixed(3)}%</div></div>`;
  html += `<div class="stat"><div class="k">IMB (5)</div><div class="v ${ob.imb5>0.15?'pass':ob.imb5<-0.15?'fail':''}">${(ob.imb5*100).toFixed(1)}%</div></div>`;
  html += `<div class="stat"><div class="k">IMB (20)</div><div class="v ${ob.imb20>0.15?'pass':ob.imb20<-0.15?'fail':''}">${(ob.imb20*100).toFixed(1)}%</div></div>`;
  html += '</div>';
  html += `<div class="grid2" style="margin-top:6px">`;
  html += `<div class="stat"><div class="k">BID VOLUME</div><div class="v" style="color:var(--green)">${fmt(ob.totalBidVol)}</div></div>`;
  html += `<div class="stat"><div class="k">ASK VOLUME</div><div class="v" style="color:var(--red)">${fmt(ob.totalAskVol)}</div></div>`;
  html += '</div>';
  html += '<div class="book" style="margin-top:8px">';
  html += '<div class="book-col">';
  for (let i = Math.min(9, ob.topBids.length-1); i >= 0; i--) {
    const b = ob.topBids[i];
    html += `<div class="book-row"><span class="bid">${fmt(b.p)}</span><span>${fmt(b.q)}</span></div>`;
  }
  html += '</div><div class="book-col">';
  for (let i = 0; i < Math.min(10, ob.topAsks.length); i++) {
    const a = ob.topAsks[i];
    html += `<div class="book-row"><span class="ask">${fmt(a.p)}</span><span>${fmt(a.q)}</span></div>`;
  }
  html += '</div></div>';
  // Walls
  html += '<div style="margin-top:8px">';
  html += '<div style="font-size:10px;color:var(--muted);margin-bottom:4px">LARGEST WALLS</div>';
  for (const w of ob.bidWalls) {
    html += `<div class="row"><span class="lbl">BID WALL @ ${fmt(w.price)}</span><span class="val pass">${fmt(w.qty)} (${w.distance.toFixed(2)}% away)</span></div>`;
  }
  for (const w of ob.askWalls) {
    html += `<div class="row"><span class="lbl">ASK WALL @ ${fmt(w.price)}</span><span class="val fail">${fmt(w.qty)} (${w.distance.toFixed(2)}% away)</span></div>`;
  }
  html += '</div></div>';

  // ---- ORDER FLOW CARD ----
  html += '<div class="card">';
  html += '<h2 style="margin-top:0">Order Flow — LIVE from aggTrades</h2>';
  html += '<div class="grid3">';
  html += `<div class="stat"><div class="k">BUY VOL</div><div class="v pass">${fmt(of.buyVol)}</div></div>`;
  html += `<div class="stat"><div class="k">SELL VOL</div><div class="v fail">${fmt(of.sellVol)}</div></div>`;
  html += `<div class="stat"><div class="k">DELTA</div><div class="v ${of.delta>0?'pass':'fail'}">${of.delta>0?'+':''}${fmt(of.delta)}</div></div>`;
  html += '</div>';
  html += '<div class="grid3" style="margin-top:6px">';
  html += `<div class="stat"><div class="k">BUY RATIO</div><div class="v ${of.buyRatio>0.55?'pass':of.buyRatio<0.45?'fail':''}">${(of.buyRatio*100).toFixed(1)}%</div></div>`;
  html += `<div class="stat"><div class="k">CVD</div><div class="v ${of.cvd>0?'pass':'fail'}">${of.cvd>0?'+':''}${fmt(of.cvd)}</div></div>`;
  html += `<div class="stat"><div class="k">TREND</div><div class="v ${of.deltaTrend>0?'pass':'fail'}">${of.deltaTrend>0?'↑':'↓'}${fmt(Math.abs(of.deltaTrend))}</div></div>`;
  html += '</div>';
  html += '<div class="grid2" style="margin-top:6px">';
  html += `<div class="stat"><div class="k">LARGEST BUY</div><div class="v pass">${fmt(of.largestBuy)}</div></div>`;
  html += `<div class="stat"><div class="k">LARGEST SELL</div><div class="v fail">${fmt(of.largestSell)}</div></div>`;
  html += '</div>';
  if (of.largeTrades.length > 0) {
    html += `<div style="margin-top:8px"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">RECENT LARGE TRADES (>$50k)</div>`;
    for (const t of of.largeTrades.slice(-5).reverse()) {
      const cls = t.side === 'BUY' ? 'pass' : 'fail';
      html += `<div class="row"><span class="lbl">${t.side} @ ${fmt(t.price)}</span><span class="val ${cls}">${fmt(t.notional)}</span></div>`;
    }
    html += '</div>';
  }
  html += '</div>';

  // ---- MANIPULATION CARD ----
  html += '<div class="card">';
  html += '<h2 style="margin-top:0">Manipulation Detection</h2>';

  // Spoofing
  html += `<div style="margin-bottom:8px"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">SPOOFING (from depth snapshots)</div>`;
  if (spoof.detected) {
    html += `<div class="row"><span class="lbl" style="color:var(--purple)">⚠ ${spoof.reason}</span></div>`;
    for (const v of spoof.vanished.slice(0, 3)) {
      html += `<div class="row"><span class="lbl">${v.side.toUpperCase()} wall @ ${fmt(v.price)}</span><span class="val purple">${fmt(v.qty)} vanished</span></div>`;
    }
  } else {
    html += `<div class="row"><span class="lbl">${spoof.reason}</span><span class="val info">${STATE.depthHistory.length} snapshots</span></div>`;
  }
  html += '</div>';

  // Stop hunts
  html += `<div style="margin-top:8px"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">STOP HUNTS (recent bars)</div>`;
  if (hunts.length > 0) {
    for (const h of hunts.reverse()) {
      html += `<div class="row"><span class="lbl">${h.type} @ ${fmt(h.level)}</span><span class="val purple">wick ${fmt(h.wick)}</span></div>`;
    }
  } else {
    html += '<div class="row"><span class="lbl">none in recent bars</span></div>';
  }
  html += '</div>';

  html += '</div>';

  // ---- VOLUME CARD ----
  html += '<div class="card">';
  html += '<h2 style="margin-top:0">Volume Profile</h2>';
  html += '<div class="grid3">';
  html += `<div class="stat"><div class="k">VOL MULT</div><div class="v ${vol.volMultiple>2?'pass':vol.volMultiple>1.5?'warn':''}">${vol.volMultiple.toFixed(2)}x</div></div>`;
  html += `<div class="stat"><div class="k">POC</div><div class="v">${fmt(vol.poc)}</div></div>`;
  html += `<div class="stat"><div class="k">IN VALUE</div><div class="v ${vol.inValueArea?'pass':'fail'}">${vol.inValueArea?'YES':'NO'}</div></div>`;
  html += '</div>';
  html += '<div class="row"><span class="lbl">VAH</span><span class="val">' + fmt(vol.vah) + '</span></div>';
  html += '<div class="row"><span class="lbl">VAL</span><span class="val">' + fmt(vol.val) + '</span></div>';
  html += '<div class="row"><span class="lbl">vs POC</span><span class="val ' + (vol.abovePOC?'pass':'fail') + '">' + (vol.abovePOC?'ABOVE':'BELOW') + '</span></div>';
  html += '<div class="row"><span class="lbl">Taker Buy Ratio</span><span class="val">' + (vol.lastBuyRatio*100).toFixed(1) + '%</span></div>';
  if (vol.absorption) {
    html += `<div class="row"><span class="lbl" style="color:var(--purple)">⚠ ABSORPTION</span><span class="val purple">${vol.absorption}</span></div>`;
  }
  html += '</div>';

  // ---- STRUCTURE CARD ----
  html += '<div class="card">';
  html += '<h2 style="margin-top:0">Market Structure (SMC/ICT)</h2>';
  html += '<div style="margin-bottom:8px">';
  if (struct.bosBull) html += '<span class="tag on">BOS ↑</span>';
  if (struct.bosBear) html += '<span class="tag danger">BOS ↓</span>';
  if (struct.chochBull) html += '<span class="tag on">CHoCH ↑</span>';
  if (struct.chochBear) html += '<span class="tag danger">CHoCH ↓</span>';
  if (struct.fvgBull) html += '<span class="tag on">FVG ↑ (age ' + struct.fvgBull.age + ')</span>';
  if (struct.fvgBear) html += '<span class="tag danger">FVG ↓ (age ' + struct.fvgBear.age + ')</span>';
  if (struct.sweepLow) html += '<span class="tag warn">SWEEP LOW</span>';
  if (struct.sweepHigh) html += '<span class="tag warn">SWEEP HIGH</span>';
  if (struct.inPremium) html += '<span class="tag danger">PREMIUM</span>';
  if (struct.inDiscount) html += '<span class="tag on">DISCOUNT</span>';
  html += '</div>';
  html += '<div class="row"><span class="lbl">Equilibrium</span><span class="val">' + fmt(struct.equilibrium) + '</span></div>';
  html += '<div class="row"><span class="lbl">Recent High</span><span class="val">' + fmt(struct.recentHigh) + '</span></div>';
  html += '<div class="row"><span class="lbl">Recent Low</span><span class="val">' + fmt(struct.recentLow) + '</span></div>';
  if (struct.sweepLevel) {
    html += '<div class="row"><span class="lbl">Sweep Level</span><span class="val warn">' + fmt(struct.sweepLevel) + '</span></div>';
  }
  html += '</div>';

  out.innerHTML = html;
}

/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sym').addEventListener('change', refresh);
  log('Market Intelligence ready', 'ok');
  log('All engines use LIVE Binance data', 'ok');
  log('Tap Refresh to load', 'ok');
  refresh();

  // Auto-refresh every 20 seconds
  setInterval(() => {
    if (!document.hidden) refresh();
  }, 20000);
});
</script>
</body>
</html>
